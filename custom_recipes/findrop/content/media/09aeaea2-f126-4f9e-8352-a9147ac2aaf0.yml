        This is a sleek digital graphic or infographic-style illustration, not a photo, with a deep black background and glowing neon teal accents.  
        At the center is a dark smartphone displaying the word “FinDrop” and a credit card icon, suggesting mobile payments, phone-based expense tracking, or financial management.  
        Surrounding the phone is a circular network of luminous icons connected by teal lines, creating a clean futuristic dashboard feel.  
        The icons represent common spending categories such as travel with an airplane, lodging with a bed, transportation with taxis, coffee or food with a steaming cup, takeaway or cafe purchases with a cup, and payment cards.  
        The main colors are black, charcoal gray, white, and bright cyan-teal glow, giving the image a high-tech, modern, premium appearance.  
        There are no people in the image.  
        The mood is polished, innovative, minimal, and professional, with a strong focus on digital finance and categorized phone expenses.
