      value: "FinDrop Travel feature illustration on the theme of automatic expense categroization\r\n\r\nA dark, minimalist graphic illustration shows a smartphone centered on a nearly black background with soft white glowing outlines.  \r\nThe phone screen displays the word “FinDrop” and a small credit card icon, while luminous connector lines link the phone to labeled expense categories.  \r\nOn the right, glowing pill-shaped labels read “Meals,” “GL 671,” and “Approved,” emphasizing automated phone expense categorization.  \r\nOn the left, a faint stylized receipt or expense document appears in gray-black tones with subtle cyan highlights, reinforcing the financial workflow theme.  \r\nThis is a polished digital UI/tech graphic rather than a photo, with a sleek fintech presentation style.  \r\nThere are no people in the image.  \r\nThe mood is futuristic, clean, intelligent, and efficient, with black, charcoal, white, and pale cyan as the dominant colors."
