      value: 'This image is a digital graphic or app interface mockup, not a photograph. The main color scheme features dark blue and black tones for the background, with glowing cyan and teal accents highlighting key elements. The central focus is a smartphone screen displaying a "BOOKING APPROVAL" section with travel options, each in glowing boxes. No people are present in the image; the interface and travel icons create a clean, modern, and professional mood. Iconography includes airplanes and shields, hinting at security and travel. Two travel options are highlighted in bright colors, while the third is grayed-out, suggesting unavailability or non-compliance. The background subtly incorporates travel-themed line drawings, enhancing the corporate and travel-related context.'
