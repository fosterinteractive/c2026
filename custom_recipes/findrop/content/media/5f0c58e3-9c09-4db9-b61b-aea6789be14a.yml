      value: "Travel Theme photographic illustration. Works well in CTAs. Not for heroes.\r\n\r\nThis is a warm, sunlit photo taken inside an airport, with bright golden light, soft beige and white highlights, and a blurred runway scene in the background.  \r\nA hand is holding a modern smartphone in the foreground, making the device the clear focal point of the image.  \r\nThe phone screen shows a digital payment or wallet interface with a credit card labeled “FinDrop” and an Apple Pay prompt, suggesting travel finance or mobile payment technology.  \r\nIn the background, a commercial airplane is visible through large airport terminal windows, slightly out of focus, reinforcing the airport setting.  \r\nThe person is not fully visible, but the image shows an adult hand with a calm, steady pose, likely representing a traveler.  \r\nThe mood feels sleek, modern, convenient, and optimistic, enhanced by the bright lens flare and sunrise or sunset glow.  \r\nThe image is a realistic commercial-style photograph with shallow depth of field, emphasizing mobile banking, contactless payment, and air travel."
