      value: 'This image is a digital graphic illustration. The background is a deep navy blue, creating a modern tech feel, with glowing cyan-blue accents throughout. At the center, a smartphone displays a “BOOKING CONFIRMED” message with details for a flight from London to NYC and a hotel booking, using white and cyan-blue fonts. To the left of the smartphone is an icon of an airport terminal, and to the right is an icon of a hotel building, both rendered in the same glowing cyan. There are no people present in the image; the scene is entirely composed of graphical elements. The overall mood is efficient, reassuring, and high-tech, suggesting a seamless booking experience. The design elements come together to clearly communicate the concept of fast online travel booking.'
