      value: "FinDrop Travel Product Illustration on theme of \"realtime\"\r\n\r\nThis is a sleek digital graphic illustration, not a photo, with a deep black background and glowing neon teal connection lines.  \r\nAt the center is a realistic black smartphone displaying the word “FinDrop” and a bright white credit card icon, emphasizing mobile expense or payment management.  \r\nRadiating around the phone are circular neon icons representing spending categories such as travel, coffee, shopping, subscriptions, entertainment, transportation, and payments.  \r\nThe main colors are black, teal, and white, creating a high-contrast futuristic fintech look.  \r\nThere are no people in the image.  \r\nThe mood is modern, tech-forward, polished, and slightly futuristic, suggesting smart financial tracking or phone-based expense management.  \r\nThe composition feels clean and minimal, with the phone acting as a central hub connected to multiple expense types across a dark glowing interface."
