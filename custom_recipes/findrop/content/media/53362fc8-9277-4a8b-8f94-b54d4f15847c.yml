      value: "Findrop expense management illustration intended for the hero area.\r\n\r\n This is a sleek digital graphic illustration, not a photo, with a deep black background and luminous gold linework.  \r\nAt the center is a dark, rectangular smartphone-like device with rounded corners, accented by a subtle gold emblem near the top and the “FileDrop” label in the middle.  \r\nThin metallic gold vertical lines stream downward from the device, while elegant swirling gold arcs and loops radiate upward, creating a flowing, futuristic energy pattern.  \r\nThe main colors are matte black, charcoal gray, and warm metallic gold, giving the image a premium and luxurious feel.  \r\nThere is no person in the image.  \r\nThe mood is modern, sophisticated, high-tech, and minimalistic, with a polished hero-banner aesthetic.  \r\nImportant objects include the central mobile device and the abstract gold light trails, which suggest connectivity, data transfer, or digital motion."
