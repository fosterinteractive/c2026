      parent_uuid: da887cdb-51a1-4da6-b10c-c2deeebb9402
      slot: accordion_content
      uuid: 5b66d957-aac6-43d0-97c1-1fc9d4143682
      component_id: sdc.byte_theme.accordion
      inputs:
        title: 'How are travel policies enforced?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: 5b66d957-aac6-43d0-97c1-1fc9d4143682
      slot: accordion_content
      uuid: ee569d8e-a3d0-4220-aac7-c26bc112eb25
      component_id: sdc.byte_theme.text
      inputs:
        text:
          value: "<p>Policies are applied in real time at booking and throughout the trip. Hotel rates, flight classes, meal per diems, and destination-specific rules are checked automatically. Out-of-policy items are flagged before they're confirmed, not after the expense report is filed.</p>"
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: da887cdb-51a1-4da6-b10c-c2deeebb9402
      slot: accordion_content
      uuid: dc31a14e-35f7-4cc5-874e-9db5fa8d7a4b
      component_id: sdc.byte_theme.accordion
      inputs:
        title: 'Do we need to replace our existing booking tools?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: dc31a14e-35f7-4cc5-874e-9db5fa8d7a4b
      slot: accordion_content
      uuid: 0c474544-81dc-4429-8feb-25201e88db26
      component_id: sdc.byte_theme.text
      inputs:
        text:
          value: '<p>No. FinDrop integrates with your existing travel booking platforms through DropPay. Employees keep using the tools they know. FinDrop handles policy enforcement, receipts, and expense reporting on top of their existing workflow.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: da887cdb-51a1-4da6-b10c-c2deeebb9402
      slot: accordion_content
      uuid: 909cd100-5712-4f8e-8104-94aa67607c26
      component_id: sdc.byte_theme.accordion
      inputs:
        title: 'How does FinDrop handle international travel?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: 909cd100-5712-4f8e-8104-94aa67607c26
      slot: accordion_content
      uuid: 4afa03f8-7dc2-4f1d-ae05-e6f6687a3bd5
      component_id: sdc.byte_theme.text
      inputs:
        text:
          value: "<p>FinDrop supports global travel with destination-specific policies, local currency reimbursements, and international per diem management. Exchange rates are locked at the time of transaction, so there's no variance between what was spent and what's reimbursed.</p>"
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: da887cdb-51a1-4da6-b10c-c2deeebb9402
      slot: accordion_content
      uuid: 75744713-a8c7-454f-b678-9372f5e359b9
      component_id: sdc.byte_theme.accordion
      inputs:
        title: 'What happens to the trip card after travel is over?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: 75744713-a8c7-454f-b678-9372f5e359b9
      slot: accordion_content
      uuid: c7a6246f-25df-4785-aa70-35d7e206126a
      component_id: sdc.byte_theme.text
      inputs:
        text:
          value: '<p>Trip-specific virtual cards freeze automatically when the trip end date passes. Any lingering authorizations are declined. All charges are already tagged and coded to the trip. Reconciliation is already done.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: da887cdb-51a1-4da6-b10c-c2deeebb9402
      slot: accordion_content
      uuid: fcee1757-10d2-473a-80d3-ff25ed3eac26
      component_id: sdc.byte_theme.accordion
      inputs:
        title: 'How does travel data connect to our other FinDrop products?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: fcee1757-10d2-473a-80d3-ff25ed3eac26
      slot: accordion_content
      uuid: 7236e0ad-335c-433d-8a2e-c67702c1110c
      component_id: sdc.byte_theme.text
      inputs:
        text:
          value: '<p>Travel spend flows into the same SmartBudgets™ dashboards and reporting as your virtual cards and expense management. One platform, one view of all company spend. No separate travel management system to reconcile.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
