      component_id: sdc.byte_theme.accordion
      inputs:
        title: 'How long does implementation take?'
        heading_level: 3
        open_by_default: true
    -
      parent_uuid: c21d66e2-3236-428e-bd4a-dd267bfbcdc4
      slot: accordion_content
      uuid: a776f2bf-58d2-4203-b12c-d736e16bf604
      component_id: sdc.byte_theme.text
      inputs:
        text:
          value: '<p>Most mid-size companies are fully live in 4 days. Our standard go-live timeline is 10 business days — no complex migrations, no dedicated IT resources required. We handle the setup and connect your existing accounting stack.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: 891ff20d-3a66-4ebb-b64d-897fe6473d09
      slot: accordion_content
      uuid: f34653b8-998c-4feb-8afd-964eabb76226
      component_id: sdc.byte_theme.accordion
      inputs:
        title: 'Which accounting platforms does FinDrop sync with?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: f34653b8-998c-4feb-8afd-964eabb76226
      slot: accordion_content
      uuid: 5a3afc3e-edb4-4181-aa87-08e4c79379ea
      component_id: sdc.byte_theme.text
      inputs:
        text:
          value: '<p>FinDrop syncs natively with QuickBooks and NetSuite, plus 50+ additional platforms. Two-way sync means every transaction flows automatically — no manual imports, no CSV exports, no reconciliation lag.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: 891ff20d-3a66-4ebb-b64d-897fe6473d09
      slot: accordion_content
      uuid: 820be957-8f7c-4cab-9ae6-eac329d02b3a
      component_id: sdc.byte_theme.accordion
      inputs:
        title: 'How does FinDrop handle spending policy enforcement?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: 820be957-8f7c-4cab-9ae6-eac329d02b3a
      slot: accordion_content
      uuid: 63d394a9-1547-4996-9ff3-d22f034e8bb6
      component_id: sdc.byte_theme.text
      inputs:
        text:
          value: '<p>Policy is enforced at the point of purchase — not discovered weeks later. Each virtual card has configurable spending limits, category restrictions, and merchant controls. Out-of-policy transactions are blocked before they happen. Approvals are required for anything outside the set parameters.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: 891ff20d-3a66-4ebb-b64d-897fe6473d09
      slot: accordion_content
      uuid: ccb0b69a-ee3c-447d-8621-a525957ca988
      component_id: sdc.byte_theme.accordion
      inputs:
        title: 'Is FinDrop secure and compliant?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: ccb0b69a-ee3c-447d-8621-a525957ca988
      slot: accordion_content
      uuid: 0ab14735-8fc2-4888-b5f6-c7347c54c05d
      component_id: sdc.byte_theme.text
      inputs:
        text:
          value: '<p>Yes. FinDrop is SOC 2 Type II certified and uses bank-level 256-bit encryption. Every virtual card has a unique number. Role-based access controls and a full audit trail give your IT and compliance teams everything they need.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: 891ff20d-3a66-4ebb-b64d-897fe6473d09
      slot: accordion_content
      uuid: 83fc42b5-533d-4baf-9932-922de13b3049
      component_id: sdc.byte_theme.accordion
      inputs:
        title: 'What does it cost?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: 83fc42b5-533d-4baf-9932-922de13b3049
      slot: accordion_content
      uuid: f508ef42-67f2-4f17-bb9c-766af1bd1d6a
      component_id: sdc.byte_theme.text
      inputs:
        text:
          value: '<p>FinDrop starts at $8 per user per month for up to 50 users, $12 per user per month for 50–200 users, and custom pricing for 200+ users. Implementation is free with an annual commitment. Most customers save $12,000 per employee annually from reduced processing costs alone.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
