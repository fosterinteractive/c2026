id: report_page_guidelines
label: 'Report Page guidelines'
description: ''
content: "These guidelines outline how to construct a \"Gated Content\" or \"Research Report\" page. The layout focuses on high-value data previewing, a detailed table of contents, and a prominent lead generation form.\r\n\r\n---\r\n\r\n## 1. Page Purpose Overview\r\nThe primary goal is **Lead Generation**. The page promotes a downloadable asset (e.g., a whitepaper or research report). It must hook the user with statistics, outline the value of the content, and end with a clear exchange of value (data for document).\r\n\r\n**Key Visual Traits:**\r\n*   **Asymmetric Layouts:** Uses side-by-side heroes and form sections.\r\n*   **Data Highlight:** Uses framed cards to make statistics pop.\r\n*   **Constrained Widths:** Uses 80% width containers to keep long-form text readable.\r\n\r\n---\r\n\r\n## 2. Hero Section (Side-by-Side)\r\n\r\n### Purpose\r\nTo display the digital asset (book cover/report) alongside the title and primary \"Download\" action.\r\n\r\n### Component Structure\r\n*   **Container:** `Hero side-by-side`\r\n*   **Hero Slot:**\r\n    1.  `Heading` (Level 4 - Eyebrow/Year)\r\n    2.  `Heading` (Level 2 - Main Title)\r\n    3.  `Text` (Summary)\r\n    4.  `Button` (Anchor link to form).\r\n\r\n### Visual Configuration & Style\r\n*   **Hero Container:**\r\n    *   **Image Position:** `right` (Places the book cover/asset to the right).\r\n    *   **Image Size:** `16:9` (Ideal for report covers).\r\n    *   **Image Radius:** `large`.\r\n    *   **Padding Block Start/End:** `32` (Tighter vertical padding than a home page hero).\r\n*   **Headings (The \"Eyebrow\" Pattern):**\r\n    *   **Top Heading:** Use `Level 4` and `text_size: default`. This acts as a tag (e.g., \"2025 Report\").\r\n    *   **Main Heading:** Use `Level 2` but keep `text_size: default` or `heading-responsive-4xl`.\r\n    *   **Alignment:** `left`.\r\n*   **Button:**\r\n    *   **Variant:** `primary`.\r\n    *   **Icon:** `arrow-right`.\r\n    *   **Label:** Strong action (e.g., \"Download Free Report\").\r\n\r\n---\r\n\r\n## 3. Key Statistics Section (Grid)\r\n\r\n### Purpose\r\nTo provide \"Teaser Data\"—high-impact stats found inside the report to prove its value immediately.\r\n\r\n### Component Structure\r\n*   **Container:** `Section`\r\n*   **Header Slot:** `Heading` (Level 2).\r\n*   **Main Slot:** 3x `Card` (Image card).\r\n\r\n### Visual Configuration & Style\r\n*   **Section:**\r\n    *   **Margin Block Start:** `128` (Distinct separation from Hero).\r\n    *   **Columns:** `33-33-33`.\r\n    *   **Width:** `100%`.\r\n*   **Cards (Data Highlight Style):**\r\n    *   **Style:** `framed` (Crucial for making the stat stand out).\r\n    *   **Orientation:** `vertical`.\r\n    *   **Center Text:** `true`.\r\n    *   **Heading Level:** `3`.\r\n    *   **Heading Text:** Use the number/stat here (e.g., \"87%\").\r\n    *   **Media:** Use abstract data visualizations or office photography.\r\n\r\n---\r\n\r\n## 4. \"What's Inside\" / Chapter List (Stacked Groups)\r\n\r\n### Purpose\r\nA Table of Contents that breaks down the report into digestible chapters, reducing the \"risk\" of downloading by showing exactly what the user gets.\r\n\r\n### Component Structure\r\n*   **Container:** `Section`\r\n*   **Header Slot:** `Heading`.\r\n*   **Main Slot:** A stack of `Group` components.\r\n    *   **Inside each Group:** `Heading` + `Text`.\r\n\r\n### Visual Configuration & Style\r\n*   **Section:**\r\n    *   **Width:** `80%` (Constrained width prevents text lines from becoming too long).\r\n    *   **Columns:** `100` (Items stacked vertically).\r\n    *   **Margin Block Start:** `96`.\r\n*   **Section Header:**\r\n    *   **Text Size:** `heading-responsive-6xl` (Very large, acts as the centerpiece of the page).\r\n    *   **Align:** `center`.\r\n*   **Groups (Chapter Rows):**\r\n    *   **Background:** `primary` (Creates a colored bar for each chapter).\r\n    *   **Padding:** `sm`.\r\n    *   **Radius:** `lg`.\r\n    *   **Flex Direction:** `column`.\r\n*   **Chapter Content:**\r\n    *   **Heading:** `Level 3`, `text_size: heading-responsive-3xl`.\r\n    *   **Text:** `text_size: text-sm` (Smaller body text for descriptions).\r\n\r\n---\r\n\r\n## 5. Download / Lead Gen Section (Split Form)\r\n\r\n### Purpose\r\nThe functional conclusion of the page. This collects user data in exchange for the asset.\r\n\r\n### Component Structure\r\n*   **Container:** `Section`\r\n*   **Header Slot:** `Heading` + `Text` (Social proof, e.g., \"Join 2,000 others\").\r\n*   **Main Slot:**\r\n    1.  `Group` (Left Column) -> Contains `Webform Block` + `Text` (Privacy notice).\r\n    2.  `Image` (Right Column) -> Visual reinforcement (Cover art).\r\n\r\n### Visual Configuration & Style\r\n*   **Section:**\r\n    *   **Width:** `80%`.\r\n    *   **Columns:** `50-50` (Form on left, Image on right).\r\n    *   **Margin Block Start:** `96`.\r\n*   **Form Group:**\r\n    *   **Items Align:** `center`.\r\n    *   **Flex Direction:** `column`.\r\n*   **Privacy Text:**\r\n    *   **Text Size:** `normal`.\r\n    *   **Style:** Italicized (using `<em>` tags in the HTML) to denote it is fine print.\r\n*   **Image:**\r\n    *   **Size:** `4:3`.\r\n    *   **Radius:** `small`.\r\n\r\n## 🧠 Layout Patterns & Best Practices\r\n\r\n### The \"Eyebrow\" Heading Pattern\r\nIn the Hero, do not use a single massive headline. Use a hierarchy:\r\n1.  **Eyebrow:** Small, descriptive tag (e.g., \"2025 Report\") using Level 4.\r\n2.  **Title:** The main engaging headline using Level 2.\r\n\r\n### The \"Chapter Stack\" Pattern\r\nTo create a readable list of features or chapters:\r\n*   Use a `Section` with `100` columns.\r\n*   Use `Groups` as the rows.\r\n*   Use `Background Colors` on the groups to visually separate them from the white background.\r\n*   Keep the Section Width at `80%` or `75%`.\r\n\r\n### Visual Rhythm (Margins)\r\n*   **128px:** Start of the first content section (Stats).\r\n*   **96px:** Between the Stats, Chapters, and Form sections.\r\n\r\n### Text Sizing Rules\r\n*   **Giant Headers:** Use `heading-responsive-6xl` for the middle-of-page anchor section (\"What's Inside\").\r\n*   **Standard Headers:** Use `heading-responsive-3xl` for sub-points (Chapter titles).\r\n*   **Data Points:** Put the statistic number directly in the `Card` heading slot."
