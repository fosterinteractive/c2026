id: feature_page_guidelines
label: 'Landing page guidelines'
description: 'Guidelines to be followed when building a landing page for a product'
content: "Here are the updated markup guidelines for the **Home Page**, with specific emphasis on **prop values** regarding color, text appearance, and styling.\r\n\r\n---\r\n\r\n# Page Building Guidelines: Product Home Page\r\n\r\nThese guidelines outline how to construct a high-converting Product Home Page. Special attention is paid to **Visual Configuration** props to ensure the correct color hierarchy and text styling.\r\n\r\n---\r\n\r\n## 1. Page Purpose Overview\r\nThe goal is to drive conversion through a clean, spacious, and trustworthy narrative. The visual style relies on high-contrast buttons, distinct card borders, and responsive text sizing to create hierarchy.\r\n\r\n---\r\n\r\n## 2. Hero Section (Billboard)\r\n\r\n### Purpose\r\nTo capture immediate attention using a large visual and a clear value proposition.\r\n\r\n### Component Structure\r\n*   **Container:** `Hero billboard`\r\n*   **Content:**\r\n    1.  `Heading` (Level 1)\r\n    2.  `Text` (Introductory paragraph)\r\n    3.  `Group` (Container for buttons) containing 2x `Button`.\r\n\r\n### Visual Configuration & Style\r\n*   **Hero Billboard:**\r\n    *   **Height:** `full` (Essential for the \"immersive\" feel).\r\n    *   **Flex Position:** `hero-center` (Centers content vertically and horizontally).\r\n    *   **Overlay Opacity:** `0%` (Assumes the image has built-in contrast; increase to `40%` if text is unreadable).\r\n*   **Heading:**\r\n    *   **Heading Level:** `1`.\r\n    *   **Text Color:** `default` (Use `inverted` if the background image is dark).\r\n    *   **Text Size:** `default`.\r\n    *   **Align:** `center`.\r\n*   **Text (Intro):**\r\n    *   **Text Size:** `text-lg` (Slightly larger than body text for readability).\r\n    *   **Text Color:** `default`.\r\n*   **Buttons:**\r\n    *   **Primary Button:** `variant: primary`, `size: large`.\r\n    *   **Secondary Button:** `variant: primary-inverted` or `secondary`, `size: large`.\r\n\r\n---\r\n\r\n## 3. Features Section (Grid)\r\n\r\n### Purpose\r\nTo outline specific product capabilities using a clean, structured grid.\r\n\r\n### Component Structure\r\n*   **Container:** `Section`\r\n*   **Header Slot:** `Heading` (Level 2)\r\n*   **Main Slot:** 3x `Image card`.\r\n\r\n### Visual Configuration & Style\r\n*   **Section:**\r\n    *   **Margin Block Start:** `128` (Creates significant whitespace between Hero and Features).\r\n    *   **Columns:** `33-33-33`.\r\n*   **Section Header (Heading):**\r\n    *   **Heading Level:** `2`.\r\n    *   **Align:** `center`.\r\n    *   **Text Color:** `default`.\r\n*   **Image Cards:**\r\n    *   **Style:** `framed` (Adds a border/background to separate the card from the white page).\r\n    *   **Heading Level:** `3`.\r\n    *   **Orientation:** `vertical`.\r\n    *   **Center Text:** `true` (Aligns content within the card).\r\n    *   **Background:** `default` (White background inside the frame).\r\n\r\n---\r\n\r\n## 4. Testimonials Section (Nested Layout)\r\n\r\n### Purpose\r\nTo highlight customer feedback using a emphasized typographic style.\r\n\r\n### Component Structure\r\n*   **Outer Container:** `Section` (Wrapper).\r\n*   **Inner Container:** `Section` (Width constrainer).\r\n    *   **Header Slot:** `Group` containing `Heading` + `Text`.\r\n    *   **Main Slot:** 4x `Testimonial card`.\r\n\r\n### Visual Configuration & Style\r\n*   **Outer Section:**\r\n    *   **Width:** `100%`.\r\n    *   **Columns:** `100`.\r\n    *   **Padding Block Start/End:** `32`.\r\n*   **Inner Section:**\r\n    *   **Width:** `80%`.\r\n    *   **Columns:** `50-50` (2x2 Grid).\r\n*   **Header Group:**\r\n    *   **Flex Direction:** `column`.\r\n    *   **Flex Gap:** `md`.\r\n*   **Header Heading:**\r\n    *   **Text Size:** `heading-responsive-4xl` (Very large to act as a major section anchor).\r\n    *   **Align:** `center`.\r\n*   **Testimonial Cards:**\r\n    *   **Style:** `default`.\r\n    *   **Align:** `center`.\r\n\r\n---\r\n\r\n## 5. Insights / Blog Section\r\n\r\n### Purpose\r\nTo link to dynamic content or resources.\r\n\r\n### Component Structure\r\n*   **Container:** `Section`\r\n*   **Main Slot:** `Views Block` (or 3x Cards).\r\n\r\n### Visual Configuration & Style\r\n*   **Section:**\r\n    *   **Margin Block Start:** `96`.\r\n    *   **Views Grid:** `33-33-33`.\r\n*   **Heading:**\r\n    *   **Text Size:** `heading-responsive-4xl`.\r\n    *   **Text Color:** `default`.\r\n    *   **Link (URL):** Must be provided to link to the blog index.\r\n\r\n---\r\n\r\n## 6. Final Call to Action (CTA)\r\n\r\n### Purpose\r\nA final, high-contrast prompt to sign up.\r\n\r\n### Component Structure\r\n*   **Container:** `Hero CTA`\r\n*   **Slots:** 2x `Button`.\r\n\r\n### Visual Configuration & Style\r\n*   **Hero CTA:**\r\n    *   **Text Align:** `center`.\r\n    *   **Heading Level:** `2`.\r\n    *   **Background Color:** Optional, but often `accent` or `muted` helps distinguish this from the footer.\r\n*   **Buttons:**\r\n    *   **Primary:** `variant: primary`, `size: medium`, `icon: arrow-right`.\r\n    *   **Secondary:** `variant: secondary`, `size: medium`.\r\n\r\n---\r\n\r\n## 🧠 Global Style Logic & Best Practices\r\n\r\n### 1. Typography Hierarchy\r\n*   **Page Title (Hero):** Always `Level 1`, `Size: default`.\r\n*   **Section Titles:** Always `Level 2`. Use `text_size: heading-responsive-4xl` for major narrative breaks (Testimonials, Insights) and `default` for functional lists (Features).\r\n*   **Card Titles:** Always `Level 3`.\r\n*   **Body Text:** Use `text-lg` for the Hero intro, and `normal` for everything else.\r\n\r\n### 2. Spacing (Vertical Rhythm)\r\n*   Use `Margin Block Start` to create rhythm.\r\n*   **128px:** Between Hero and the first content section.\r\n*   **96px:** Between major content blocks.\r\n*   **64px:** Between smaller, related blocks (like logos).\r\n\r\n### 3. Color Usage\r\n*   **Text Color:** Default to `default`. Only use `inverted` if you explicitly set a dark background color on a Section or Card.\r\n*   **Button Hierarchy:**\r\n    *   **Primary Action:** `variant: primary`.\r\n    *   **Secondary Action:** `variant: secondary` or `primary-inverted`.\r\n    *   **Tertiary Action (Navbar):** `variant: primary`, `size: small`.\r\n\r\n### 4.Webforms\r\n- If the user asks to create an webform, only allow the webform ids you know about and see if there is something similar to what they are asking for. If so, set the id of the webform on the webform_id on the webform component."
