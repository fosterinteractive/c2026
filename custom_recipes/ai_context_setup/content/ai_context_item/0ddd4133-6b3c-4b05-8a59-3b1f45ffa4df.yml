      value: 'Contains global brand identity, product naming rules, and competitive positioning policies that apply globally. Skip only for internal technical documentation or API references."'
      format: plain_text
  content:
    -
      value: "# Brand Guidelines\r\n\r\n## Brand Foundation\r\n\r\n### Mission\r\n\r\nTo empower finance teams with instant control and complete visibility over corporate spending through intelligent virtual cards, automated expense management, and seamless business travel.\r\n\r\n### Vision\r\n\r\nTo become the global standard for B2B financial automation, where every business transaction — from a team lunch receipt to a cross-country flight — is instant, transparent, and optimized.\r\n\r\n### Core Values\r\n\r\n* **Speed Over Complexity** — Financial operations should move at the speed of business. No waiting, no delays, just instant action.\r\n* **Transparency by Default** — Every transaction, every approval, every report — visible and accessible live to those who need it.\r\n* **Intelligence at Scale** — Smart automation that learns and improves, turning expense management from a burden into a competitive advantage.\r\n* **Trust Through Control** — Empowering finance teams with granular controls that prevent problems before they happen, not after.\r\n\r\n### Brand Promise\r\n\r\n\"From expense chaos to complete control in minutes, not months.\"\r\n\r\n### Brand Positioning Statement\r\n\r\nFor mid-market B2B companies drowning in manual expense processes, FinDrop is the only financial operations platform that combines instant card issuance, live expense tracking, AI-powered optimization, and integrated business travel — cutting processing time by 80% while maintaining complete financial control.\r\n\r\n***\r\n\r\n## Product Portfolio\r\n\r\n### Naming Conventions\r\n\r\n**Master Brand:** FinDrop (always one word, capital F and D)\r\n\r\n**Product Lines:**\r\n\r\n* **FinDrop Cards** — Virtual and physical corporate card platform\r\n* **FinDrop Expense** — Automated expense tracking, receipt capture, and reconciliation\r\n\r\n**Naming Rules:**\r\n\r\n* Always start with \"FinDrop\" followed by a single descriptive noun.\r\n* Keep feature names to one word when possible.\r\n* Use action-oriented or benefit-focused terms.\r\n* Avoid technical jargon in product names.\r\n* Never abbreviate FinDrop or use \"FD\" shorthand.\r\n\r\n### Product Descriptions\r\n\r\n| Product         | One-liner                                                    | Hero line                                                 |\r\n| --------------- | ------------------------------------------------------------ | --------------------------------------------------------- |\r\n| FinDrop Cards   | Instant virtual corporate cards with built-in spend controls | \"Create and control corporate cards in seconds, not days\" |\r\n| FinDrop Expense | Automated expense management from swipe to reconciliation    | \"Stop chasing receipts. Start closing books faster.\"      |\r\n\r\n***\r\n\r\n## Competitive Positioning\r\n\r\n### Market Position\r\n\r\nFinDrop occupies the \"smart middle\" of the financial operations market:\r\n\r\n* More sophisticated than basic corporate cards (traditional banks)\r\n* More accessible than enterprise solutions (SAQ Concur)\r\n* More comprehensive than point solutions (single-feature tools)\r\n* More modern than legacy travel management (old TMCs and booking portals)\r\n\r\n### Competitive Response Guidelines\r\n\r\n**Rule: Never mention competitors by name without legal approval.**\r\n\r\nAll competitor mentions — by name or by clear implication — require explicit written approval from the Legal department before publication. This applies to website pages, marketing emails, social media, advertising, press releases, and any public-facing content generated by AI tools in Canvas.\r\n\r\n**Where competitor mentions MAY be approved (case by case):**\r\n\r\n* Dedicated comparison pages (e.g., findrop.com/compare/rimp)\r\n* RFP responses to specific customer requests\r\n* Sales battle cards (internal use only)\r\n* Analyst briefings\r\n\r\n**Where competitor mentions are NEVER approved:**\r\n\r\n* Product pages\r\n* Homepage or main marketing pages\r\n* Social media posts\r\n* Initial pitch decks shared externally\r\n* AI-generated content on Canvas unless explicitly approved per-page\r\n\r\n**How to position without naming competitors:**\r\n\r\nUse category language instead:\r\n\r\n* \"Unlike traditional corporate cards...\" (not \"Unlike Rimp...\")\r\n* \"Unlike legacy travel portals...\" (not \"Unlike SAQ Concur...\")\r\n* \"Unlike point solutions that only cover cards or only cover travel...\" (not \"Unlike Brix or Navan...\")\r\n\r\n### Claims Requiring Legal Review\r\n\r\nThe following claim types MUST be reviewed by Legal before publication, regardless of whether competitors are named:\r\n\r\n* Any claim using a specific competitor's name\r\n* Any claim of being \"first,\" \"only,\" or \"best\" in a category\r\n* Performance comparisons with specific numbers (e.g., \"2x faster than legacy tools\")\r\n* Customer savings claims exceeding documented case studies\r\n* Security or compliance superiority claims\r\n* Adoption rate claims (e.g., \"90%+ adoption\") used in customer-facing content\r\n\r\n**Internal exception:** The Sales Training Deck names competitors directly for internal training purposes. This content must NEVER be copied into external-facing materials without legal review. When AI references the Sales Deck via the CCC, competitor names must be stripped from any generated output destined for public pages.\r\n\r\n***\r\n\r\n## Sub-Contexts\r\n\r\n* **Abbreviations, Spelling, Dates & Formatting** — Grammar standards, capitalization, number formatting, and vocabulary rules. Applies to all writing tasks.\r\n* **Writing Tone & Voice** — Voice foundation, copy patterns, data-confidence rules, and audience-specific tone guidance. Applies to all writing tasks. Does not apply to internal technical documentation.\r\n* **Visuals & Imagery** — Custom illustration style, product imagery, Phosphor icon usage, and image selection rules. Applies to media selection tasks.\r\n\r\n***\r\n\r\n## Checklist\r\n\r\n* FinDrop spelled correctly (one word, capital F and D)?\r\n* Product lines use official names (FinDrop Cards, FinDrop Expense)?\r\n* No competitor names used without legal approval?\r\n* No \"first/only/best\" claims without legal review?\r\n* Performance comparison claims backed by approved data from Key Facts?\r\n* Category language used instead of competitor names?"
