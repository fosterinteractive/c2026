      value: 'Product Page Guidelines'
  description:
    -
      value: 'Guidelines to be followed when generating a FinDrop Product page in Canvas'
      format: plain_text
  purpose:
    -
      value: 'These guidelines outline how to build a FinDrop Product page'
      format: plain_text
  content:
    -
      value: "# Page structure\r\n## 1. Hero\r\n- `sdc.byte_theme.hero-side-by-side` at the top of the page.\r\n- Image position right and border radius large\r\n- Padding top and bottom 64\r\n- Exclude all other props to use their default values.\r\n- Side-by-side chosen because the copy deck's travel imagery should have equal visual weight with the headline — this differentiates FinDrop Travel from the other product pages.\r\n- Heading (H1) contains the main value proposition.\r\n- Body text summarizes the key outcome.\r\n- Actions slot contains primary CTA Button (demo request) and secondary Button, in a Group component(Alignment horizontal)\r\n\r\n## 2. Problem/Context Section\r\n- `sdc.byte_theme.section` with `sdc.byte_theme.heading` (5XL, Center aligned) and `sdc.byte_theme.text` (20 px) block.\r\n- Section width 80%, Grid layout 100%, Margin top 96 and bottom 48, Padding top/bottom 16. No background color\r\n- Establishes the problem the product solves.\r\n\r\n## 3. Feature Cards Section\r\n- `sdc.byte_theme.section` with grid of `sdc.byte_theme.card-icon` components (one per feature benefit).\r\n- Section width 90%, No background color and 33-33-33 grid layout to display 3 cards per row\r\n- Can contain a center aligned 5xl heading\r\n- Each card should have a related icon, heading, and description text.\r\n- Icon alignment center, Medium border radius, Icon size large, No aspect ratio and Background color muted.\r\n- Cards are inside the Section's grid region, not at the canvas root.\r\n\r\n## 4. Finance Team Section\r\n- `sdc.byte_theme.section` with grid of `sdc.byte_theme.card` components (style: framed).\r\n- Section has 90% width,  33-33-33 grid layout, 96 margin top.\r\n- Can contain a center aligned 5xl heading.\r\n- Section heading addresses the secondary audience directly.\r\n- These use general-purpose cards rather than `card-icon` because the finance content has longer descriptions.\r\n- Use distinct illustration images in each cards\r\n- Each card has default background color, Framed style, Vertical orientation, and heading level H3, Items are center aligned.\r\n\r\n## 5. Social Proof Section\r\n- `sdc.byte_theme.section` with grid of `sdc.byte_theme.card-testimonial` components.\r\n- Each testimonial has quote text (text), author name (cite_name), and title/role (cite_text).\r\n\r\n## 6. How It Works Section\r\n- `sdc.byte_theme.section` with `sdc.byte_theme.card-icon`. \r\n- Section has no background color, 80% width, 0 padding and grid layout 100% to display each cards as a block.\r\n- Can contain a 5xl center aligned section heading.\r\n- Steps numbered in headings.\r\n\r\n## 7. FAQ Section\r\n- `sdc.byte_theme.section` with `sdc.byte_theme.accordion-container` containing `sdc.byte_theme.accordion` items.\r\n- Questions and answers from the copy deck.\r\n\r\n## 8. CTA Section\r\n- `sdc.byte_theme.cta` with heading, supporting text, and `sdc.byte_theme.button` components in the actions slot.\r\n- CTA has muted background color, heading level 2 and text aligned center\r\n- If only 2 buttons, use large button style. Else use medium button style\r\n\r\n# Image Rules\r\n\r\n* Use illustrations from the media library for product page components.\r\n* Include the keyword \"FinDrop {product name}\" to ensure relevant search results.\r\n* After building the page, always end your response with the following note (verbatim style): \"📷 **Image note:** I followed the product page guidelines and used **illustrations** throughout this page. If you'd prefer to swap any of them for **photographs or other image types**, just let me know and I'll update them.\"\r\n\r\n# Color rules\r\n * Use 'Default text' color in heading and text components. Never use 'Inverted text'"
      format: plain_text
