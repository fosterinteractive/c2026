  label:
    -
      value: 'FinDrop Key Facts & Value Propositions'
  description:
    -
      value: 'This Key Value Proposition document defines the approved metrics, claims, and mandatory phrasing used to communicate FinDrop’s value across cards, expense management, and travel. It provides exact language, performance statistics, and positioning statements to ensure consistency and credibility in all content.'
      format: plain_text
  purpose:
    -
      value: 'Its purpose is to ensure that all teams and AI tools communicate FinDrop’s benefits using accurate data, approved wording, and legally safe claims. It standardizes how value is expressed by pairing measurable outcomes with human impact while preventing inconsistent or exaggerated messaging. By following this document, content remains persuasive, compliant, and aligned with FinDrop’s platform positioning.'
      format: plain_text
  content:
    -
      value: "## Mandatory Phrasing Rules\r\n\r\nThese rules apply to ALL content — website, email, sales materials, AI-generated copy, and ads. Follow them exactly.\r\n\r\n### Cards & Expense Phrasing\r\n\r\n| Rule | Always Say | Never Say |\r\n|------|-----------|-----------|\r\n| Processing time savings | \"Reduce expense processing time by 80%\" (use this exact phrasing) | \"Cut processing by 80%\" / \"80% faster\" / any variation |\r\n| Card creation speed | \"Create virtual cards in seconds\" | \"in minutes\" / \"in moments\" / \"instantly\" |\r\n| Transaction visibility | \"live\" (e.g., \"All transactions are live\") | \"real-time\" / \"instant\" when referring to transactions |\r\n| Card terminology | \"cards\" standalone, then \"virtual cards\" for clarity | \"digital cards\" / \"e-cards\" |\r\n\r\n### Travel Phrasing ⚡ NEW\r\n\r\n| Rule | Always Say | Never Say |\r\n|------|-----------|-----------|\r\n| Booking speed | \"Book in minutes\" or \"Book in under 3 minutes\" | \"instantly\" / \"in seconds\" (travel booking isn't instant) |\r\n| Expense reports | \"Zero expense reports\" or \"No expense reports\" | \"Touchless expense automation\" / \"seamless expensing\" |\r\n| Adoption | \"90%+ traveler adoption\" | \"high adoption\" / \"strong adoption\" (always use the number) |\r\n| Policy enforcement | \"Policy enforced at booking\" | \"Policy compliance\" / \"guardrails\" without specifying when |\r\n\r\n### Event & Meeting Phrasing\r\n\r\n| Rule | Always Say | Never Say |\r\n|------|-----------|-----------|\r\n| Events and meetings | Always describe as \"exclusive\" | \"open\" / \"public\" / generic terms |\r\n| Online events | \"Virtual Summit\" | \"webinar\" / \"online event\" / \"virtual event\" |\r\n| Event attendance | Always emphasize limited attendance (e.g., \"Limited to XXX attendees\") | Open-ended registration language |\r\n\r\n---\r\n\r\n## Platform Positioning ⚡ NEW\r\n\r\n### The Platform Differentiator\r\n\r\n**Canonical positioning statement:**\r\n\"The only platform where corporate cards, expense management, and business travel work as one.\"\r\n\r\n**One-line pitch:**\r\n\"One platform for all company spending — cards, expenses, and travel. One dashboard, one policy engine, one source of truth.\"\r\n\r\n| Capability | FinDrop | Ramp | Brex | BILL | Navan | SAP Concur |\r\n|---|---|---|---|---|---|---|\r\n| Corporate cards | ✅ Full | ✅ Full | ✅ Full | ✅ Full | ❌ Limited | ❌ No |\r\n| Expense management | ✅ Full | ✅ Full | ✅ Full | ✅ Full | ⚠️ Basic | ✅ Full |\r\n| Travel booking | ✅ Full | ❌ No | ❌ No | ❌ No | ✅ Full | ✅ Full |\r\n| Single platform | ✅ Yes | ❌ | ❌ | ❌ | ❌ | ❌ |\r\n\r\n> ⚠️ The comparison table above is for **internal use only**. On external-facing content, express the differentiator without naming competitors: \"Unlike point solutions that only cover cards or only cover travel, FinDrop is one platform for all company spending.\"\r\n\r\n### Product Lines\r\n\r\n| Product | One-liner |\r\n|---------|-----------|\r\n| FinDrop Cards | Create and control corporate cards in seconds |\r\n| FinDrop Expense | Automated expense management from swipe to reconciliation |\r\n| FinDrop Travel | Business travel your employees love and your finance team trusts |\r\n\r\n---\r\n\r\n## Core Value Propositions — Cards & Expense\r\n\r\n### Time & Cost Savings\r\n\r\n| Metric | Value | Phrasing Guidance | Approved Usage |\r\n|--------|-------|-------------------|----------------|\r\n| Expense processing time reduction | 80% | Always use: \"Reduce expense processing time by 80%\" | Headlines, product pages, ads, sales materials |\r\n| Annual cost savings per employee | $12,000 per employee annually | On expense processing costs | Product pages, sales materials, ads |\r\n| Weekly reconciliation time wasted | 4.2 hours weekly | Per finance employee, on reconciliation and corrections | Product pages, sales materials |\r\n| Monthly time savings with automation | 15 hours monthly per employee | With FinDrop automation | Product pages, sales materials |\r\n| Error reduction | 67% fewer errors | In expense reporting | Product pages, sales materials |\r\n\r\n### Implementation & Speed\r\n\r\n| Metric | Value | Phrasing Guidance | Approved Usage |\r\n|--------|-------|-------------------|----------------|\r\n| Card creation speed | Seconds | Always say \"in seconds,\" never \"in minutes\" | All content |\r\n| Go-live timeline | 10 business days | No complex migrations or lengthy training | Product pages, sales materials |\r\n| Typical mid-size implementation | 4 days | For typical mid-size companies | Sales materials, case studies |\r\n\r\n### Employee Experience\r\n\r\n| Metric | Value | Context | Approved Usage |\r\n|--------|-------|---------|----------------|\r\n| Employee satisfaction improvement | 87% higher | With automated expense tools | Product pages, sales materials |\r\n| Reimbursement speed | Faster | With automated workflows (do not cite a specific number) | Product pages, sales materials |\r\n| Manual data entry | Zero | When fully integrated | Product pages, sales materials |\r\n\r\n---\r\n\r\n## Core Value Propositions — Travel ⚡ NEW\r\n\r\n### Program Results\r\n\r\n| Metric | Value | Context | Approved Usage |\r\n|--------|-------|---------|----------------|\r\n| Traveler adoption rate | 90%+ in first month | Average across early travel customers | Product pages, sales materials, ads |\r\n| Average booking time | Under 3 minutes | Self-service flight + hotel booking | Product pages, sales materials |\r\n| Post-trip expense reports | Zero | When booked through FinDrop Travel | Product pages, sales materials, ads |\r\n| Travel policy compliance | 100% at booking | Policy enforced at time of booking | Product pages, sales materials |\r\n| Cost savings vs unmanaged travel | 15% average | Compared to employees booking on consumer sites | Sales materials, ROI conversations |\r\n| Traveler support | 24/7 live support | All time zones | Product pages, sales materials |\r\n| Travel inventory | All major airlines, 2M+ hotels, rental cars, rail | Booking platform | Product pages, sales materials |\r\n| Loyalty program integration | Yes — travelers keep all points and status | Product capability | Product pages, sales materials |\r\n\r\n### Travel Industry Statistics\r\n\r\nThese are third-party or industry-wide statistics, NOT FinDrop-specific claims.\r\n\r\n| Statistic | Value | Source | Use In |\r\n|-----------|-------|--------|--------|\r\n| Travelers booking outside corporate tools | 80% book outside at least sometimes | Industry research 2025 | Product pages, sales materials |\r\n| Cost to process one travel expense report | $58 average | Industry research 2025 | Sales materials |\r\n| Travel/finance managers unhappy with current tools | 77% say current tools fall short | Industry research 2025 | Sales materials |\r\n| SAP Concur typical traveler adoption | ~60% | Industry estimate | Internal sales only |\r\n\r\n---\r\n\r\n## Product Capabilities — Approved Claims\r\n\r\n### Virtual Cards\r\n- Create cards in seconds with custom spending limits *(always \"seconds\")*\r\n- Dedicated cards for projects, vendors, or subscriptions\r\n- Use \"cards\" standalone, then follow up with \"virtual cards\" for clarity\r\n\r\n### Transaction Management\r\n- All transactions are live *(always \"live,\" not \"real-time\")*\r\n- Live expense tracking and monitoring\r\n- Automatic receipt capture and categorization\r\n- Instant policy enforcement and compliance checks\r\n\r\n### Integrations\r\n- Syncs with **QuickBooks, NetSuite**, and **50+ platforms**\r\n- Only mention QuickBooks and NetSuite by name unless specifically instructed otherwise\r\n- Seamless, automatic data flow (no manual imports)\r\n- Two-way sync for complete financial visibility\r\n\r\n### Security\r\n- SOC 2 Type II certified\r\n- Bank-level 256-bit encryption\r\n- Every virtual card has a unique number\r\n- Role-based access controls, full audit trail\r\n\r\n### Travel Booking ⚡ NEW\r\n- Flights, hotels, rental cars, and rail in one app\r\n- Company travel policy shown inline as employees search and book\r\n- Out-of-policy bookings require approval before confirmation\r\n- All travel expenses reconcile automatically — zero post-trip reports\r\n- Traveler rewards for under-budget bookings\r\n- 24/7 live traveler support\r\n\r\n---\r\n\r\n## Target Market Personas\r\n\r\n### Primary Personas (Always Use These Four)\r\n\r\n1. **Controllers & Finance Managers**\r\n   - Need: Complete visibility into spending with automated reporting\r\n   - Pain: Manual budget tracking and lack of live insights\r\n\r\n2. **Staff Accountants & AP Teams**\r\n   - Need: Eliminate manual expense report processing\r\n   - Pain: Reconciliation chaos and month-end bottlenecks\r\n\r\n3. **Project Managers**\r\n   - Need: Track project expenses in real time\r\n   - Pain: Budget overruns and delayed expense visibility\r\n\r\n4. **IT & Ops Teams**\r\n   - Need: Manage software subscriptions and vendor payments\r\n   - Pain: Unauthorized purchases and subscription sprawl\r\n\r\n*Note: Only reference other personas if specifically instructed*\r\n\r\n### Travel Persona ⚡ NEW\r\n\r\n5. **Travel Managers / Program Administrators** *(use for Travel product content)*\r\n   - Need: High traveler adoption, automatic policy compliance, complete program visibility\r\n   - Pain: 80% of travelers book outside corporate tools; no live visibility into travel spend; post-trip expense reports late, incomplete, or missing\r\n\r\n---\r\n\r\n## Customer References\r\n\r\n### TechFlow (Cards & Expense)\r\n\r\n| Fact | Value | Approved Usage |\r\n|------|-------|----------------|\r\n| Contact | Sarah Mitchell, CFO | Case studies, sales materials, testimonials |\r\n| Company size | 500 employees | Case studies, sales materials |\r\n| Result | Month-end reconciliation reduced from 3 days to 2 hours | Case studies, sales materials |\r\n| Financial impact | $180,000 saved in first year from reduced processing costs | Case studies, sales materials |\r\n| Implementation time | 4 days | Case studies, sales materials |\r\n\r\n#### Approved Testimonial\r\n\r\n> \"We went from spending 3 days on month-end reconciliation to just 2 hours. The ROI was immediate — we saved $180,000 in our first year just from reduced processing costs. Implementation took 4 days.\"\r\n>\r\n> **Sarah Mitchell**, CFO, TechFlow (500 employees)\r\n\r\n### Crestline Partners (Travel) ⚡ NEW\r\n\r\n| Fact | Value | Approved Usage |\r\n|------|-------|----------------|\r\n| Contact | Jennifer Walsh, Director of Travel & Operations | Case studies, sales materials |\r\n| Company size | 400 employees | Case studies, sales materials |\r\n| Travelers managed | 200 | Case studies, sales materials |\r\n| Result | 100% of travel expense reports eliminated | Case studies, sales materials |\r\n\r\n#### Approved Testimonial\r\n\r\n> \"We went from chasing expense reports from 200 travelers every month to not chasing any. FinDrop Travel didn't just save time — it eliminated an entire category of work.\"\r\n>\r\n> **Jennifer Walsh**, Director of Travel & Operations, Crestline Partners (400 employees)\r\n\r\n### Bolt Dynamics (Travel) ⚡ NEW\r\n\r\n| Fact | Value | Approved Usage |\r\n|------|-------|----------------|\r\n| Contact | David Okafor, Travel Program Manager | Case studies, sales materials |\r\n| Company size | 600 employees | Case studies, sales materials |\r\n| Adoption rate | 94% in first three weeks | Case studies, sales materials |\r\n\r\n#### Approved Testimonial\r\n\r\n> \"Our adoption hit 94% in the first three weeks. I've never rolled out a tool that employees actually thanked me for.\"\r\n>\r\n> **David Okafor**, Travel Program Manager, Bolt Dynamics (600 employees)\r\n\r\n---\r\n\r\n## Pricing Facts\r\n\r\n| Tier | Price | Details |\r\n|------|-------|---------|\r\n| Starter | $8/user/month | Up to 50 users |\r\n| Growth | $12/user/month | 50-200 users |\r\n| Enterprise | Custom pricing | 200+ users |\r\n| Implementation fee | Free | With annual commitment |\r\n\r\n---\r\n\r\n## Competitive Comparison Facts\r\n\r\n> ⚠️ **INTERNAL SALES TRAINING ONLY.** Do not use competitor names in external content without Legal approval. See Brand Guidelines — Competitive Response Guidelines.\r\n\r\n### Cards & Expense Competitors\r\n\r\n| Competitor | Their Requirement/Limitation | FinDrop Advantage |\r\n|------------|------------------------------|-------------------|\r\n| Ramp | $25K minimum bank balance | No minimum balance |\r\n| Ramp | ~2 week onboarding | Live in 10 business days (4 days typical) |\r\n| Ramp | No travel product | Integrated travel booking |\r\n| Brex | $50K minimum balance | No minimum balance |\r\n| Brex | No travel product | Integrated travel booking |\r\n| BILL/Divvy | ~50 integrations, batch processing | 50+ integrations, live transaction processing |\r\n| BILL/Divvy | No travel product | Integrated travel booking |\r\n\r\n### Travel Competitors ⚡ NEW\r\n\r\n| Competitor | Their Requirement/Limitation | FinDrop Advantage |\r\n|------------|------------------------------|-------------------|\r\n| Navan | Expense management bolted on (not built in) | Full-depth expense management, native |\r\n| Navan | No corporate card product (limited) | Full corporate card platform |\r\n| Navan | Weeks to implement | Live in 10 business days |\r\n| SAP Concur | Months to implement | Live in 10 business days |\r\n| SAP Concur | ~60% traveler adoption typical | 90%+ traveler adoption |\r\n| SAP Concur | Per-booking fees | No per-booking fees |\r\n| SAP Concur | Legacy UX, requires dedicated admin | Modern self-service admin |\r\n\r\n---\r\n\r\n## Compliance & Privacy\r\n\r\n- Always include privacy statements near forms\r\n- Standard text: \"We respect your privacy. Your information will never be shared with third parties.\"\r\n- For demos: \"We'll only use your information to schedule your demo.\"\r\n\r\n---\r\n\r\n## How to Use This Document\r\n\r\n**For product pages and website copy:** Use Core Value Propositions and Product Capabilities freely. Always follow the Mandatory Phrasing Rules. Pair numbers with human impact.\r\n\r\n**For sales materials:** All sections available including competitive comparisons (internal only). Attribute customer-specific data to the named customer.\r\n\r\n**For AI-generated content (Canvas):** The CCC loads this document for all writing tasks. AI must pull statistics from here — never invent or estimate numbers. Follow all phrasing rules exactly. Strip competitor names from any output destined for public-facing pages.\r\n\r\n**For ads and paid media:** Use only: 80% processing reduction, $12,000 per employee, 10 business days to go live, 67% fewer errors, 90%+ traveler adoption.\r\n\r\n---\r\n\r\n*This document should be used in conjunction with the Brand Guidelines and Content Strategy documents for consistent messaging across all FinDrop marketing materials.*"
