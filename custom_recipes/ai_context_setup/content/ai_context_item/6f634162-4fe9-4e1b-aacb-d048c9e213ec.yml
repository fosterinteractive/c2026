      value: 'FinDrop Key Facts & Value Propositions '
  description:
    -
      value: 'This Key Value Proposition document defines the approved metrics, claims, and mandatory phrasing used to communicate FinDrop’s value across cards, expense management, and travel. It provides exact language, performance statistics, and positioning statements to ensure consistency and credibility in all content.'
      format: plain_text
  purpose:
    -
      value: 'Load when writing ANY external-facing FinDrop content. This is the single source of truth for approved statistics, value propositions, product claims, and messaging. Agent must pull numbers from here, never invent or estimate. Skip only for content that requires no stats or product claims (e.g., purely navigational elements).'
      format: plain_text
  content:
    -
      value: "# Key Facts & Value Propositions\r\n\r\n> **Usage Rule:** All statistics used in external-facing content MUST come from this document. Do not invent, estimate, or round numbers beyond what is listed here. AI-generated content in Canvas must pull statistics from this document, not from training data or other sources.\r\n\r\n***\r\n\r\n## Mandatory Phrasing Rules\r\n\r\nThese exact phrasings must be used when referencing these metrics. No variations.\r\n\r\n| Metric                  | Always Say                                                      | Never Say                                              |\r\n| ----------------------- | --------------------------------------------------------------- | ------------------------------------------------------ |\r\n| Processing time savings | \"Reduce expense processing time by 80%\"                         | \"Cut processing by 80%\" / \"80% faster\" / any variation |\r\n| Card creation speed     | \"Create virtual cards in seconds\"                               | \"in minutes\" / \"in moments\" / \"instantly\"              |\r\n| Transaction visibility  | \"live\" (e.g., \"All transactions are live\")                      | \"real-time\" / \"instant\" when referring to transactions |\r\n| Card terminology        | \"cards\" standalone, then \"virtual cards\" for clarity            | \"digital cards\" / \"e-cards\"                            |\r\n| Events and meetings     | Always describe as \"exclusive\"                                  | \"open\" / \"public\" / generic terms                      |\r\n| Online events           | \"Virtual Summit\"                                                | \"webinar\" / \"online event\" / \"virtual event\"           |\r\n| Event attendance        | Emphasize limited attendance (e.g., \"Limited to XXX attendees\") | Open-ended registration language                       |\r\n\r\n***\r\n\r\n## Approved Statistics\r\n\r\n### Time & Cost Savings\r\n\r\n| Metric                               | Approved Value                | Context                                                     | Approved Usage                                 |\r\n| ------------------------------------ | ----------------------------- | ----------------------------------------------------------- | ---------------------------------------------- |\r\n| Expense processing time reduction    | 80%                           | Use exact phrasing: \"Reduce expense processing time by 80%\" | Headlines, product pages, ads, sales materials |\r\n| Annual cost savings per employee     | $12,000 per employee annually | On expense processing costs                                 | Product pages, sales materials, ads            |\r\n| Weekly reconciliation time wasted    | 4.2 hours weekly              | Per finance employee, on reconciliation and corrections     | Product pages, sales materials                 |\r\n| Monthly time savings with automation | 15 hours monthly per employee | With FinDrop automation                                     | Product pages, sales materials                 |\r\n| Error reduction                      | 67% fewer errors              | In expense reporting                                        | Product pages, sales materials                 |\r\n\r\n### Implementation & Speed\r\n\r\n| Metric                          | Approved Value   | Context                                   | Approved Usage                 |\r\n| ------------------------------- | ---------------- | ----------------------------------------- | ------------------------------ |\r\n| Card creation speed             | Seconds          | Always \"in seconds,\" never \"in minutes\"   | All content                    |\r\n| Go-live timeline                | 10 business days | No complex migrations or lengthy training | Product pages, sales materials |\r\n| Typical mid-size implementation | 4 days           | For typical mid-size companies            | Sales materials, case studies  |\r\n\r\n### Employee Experience\r\n\r\n| Metric                            | Approved Value | Context                       | Approved Usage                 |\r\n| --------------------------------- | -------------- | ----------------------------- | ------------------------------ |\r\n| Employee satisfaction improvement | 87% higher     | With automated expense tools  | Product pages, sales materials |\r\n| Reimbursement speed               | Faster         | Do not cite a specific number | Product pages, sales materials |\r\n| Manual data entry                 | Zero           | When fully integrated         | Product pages, sales materials |\r\n\r\n**For ads and paid media, use only:** 80% processing reduction, $12,000 per employee, 10 business days to go live, 67% fewer errors.\r\n\r\n***\r\n\r\n## Product Capabilities — Approved Claims\r\n\r\n### Virtual Cards\r\n\r\n* Create cards in seconds with custom spending limits *(always \"seconds\")*\r\n* Dedicated cards for projects, vendors, or subscriptions\r\n* Use \"cards\" first mention, then \"virtual cards\" for clarity\r\n\r\n### Transaction Management\r\n\r\n* All transactions are live *(always \"live,\" not \"real-time\")*\r\n* Live expense tracking and monitoring\r\n* Automatic receipt capture and categorization\r\n* Instant policy enforcement and compliance checks\r\n\r\n### Integrations\r\n\r\n* Syncs with **QuickBooks, NetSuite**, and **50+ platforms**\r\n* Only mention QuickBooks and NetSuite by name unless specifically instructed otherwise\r\n* Seamless, automatic data flow (no manual imports)\r\n* Two-way sync for complete financial visibility\r\n\r\n### Security\r\n\r\n* SOC 2 Type II certified\r\n* Bank-level 256-bit encryption\r\n* Every virtual card has a unique number\r\n* Role-based access controls, full audit trail\r\n\r\n***\r\n\r\n## Value Propositions & Messaging\r\n\r\n### Platform-Level\r\n\r\n**Primary Message:**\r\n\"The only platform where corporate cards, expense management, and business travel work as one — saving your team 15 hours every month.\"\r\n\r\n**Elevator Pitch (30 seconds):**\r\n\"FinDrop lets companies create virtual corporate cards in seconds, track spending live, and book business travel — all without manual expense reports. We reduce expense processing time by 80% and give employees a booking experience they actually enjoy.\"\r\n\r\n### Product-Level\r\n\r\n#### FinDrop Cards\r\n\r\n**Primary:** \"Create and control corporate cards in seconds, not days\"\r\n\r\n**Supporting messages:**\r\n\r\n1. **Instant issuance** — \"Deploy cards for any team, vendor, or project in seconds\"\r\n2. **Built-in controls** — \"Set limits before spending happens, not after\"\r\n3. **Automatic capture** — \"Every transaction tracked, every receipt captured, zero manual work\"\r\n\r\n#### FinDrop Expense\r\n\r\n**Primary:** \"Stop chasing receipts. Start closing books faster.\"\r\n\r\n**Supporting messages:**\r\n\r\n1. **Automated reconciliation** — \"Expenses categorized and synced the moment they happen\"\r\n2. **Policy enforcement** — \"Out-of-policy spend caught before it hits the books\"\r\n3. **Close faster** — \"Month-end close in 2 days, not 10\"\r\n\r\n### Feature-to-Benefit Translation Pattern\r\n\r\nAll product messaging follows: **Feature → Benefit → Result**\r\n\r\n* *Feature:* Virtual cards → *Benefit:* No waiting for plastic → *Result:* Start spending immediately\r\n* *Feature:* In-app booking → *Benefit:* No travel agents or phone calls → *Result:* Trip booked in minutes\r\n* *Feature:* Auto-capture → *Benefit:* No lost receipts → *Result:* Full compliance\r\n\r\n### CTA Library\r\n\r\n#### High Intent\r\n\r\n* \"Start Saving 15 Hours Per Month\"\r\n* \"Get Your First Card in 60 Seconds\"\r\n* \"See Your ROI Calculator\"\r\n* \"See FinDrop Travel in Action\"\r\n\r\n#### Medium Intent\r\n\r\n* \"Watch 3-Minute Demo\"\r\n* \"Download Cost Savings Guide\"\r\n* \"See How Travel Management Works\"\r\n* \"Compare vs. \\[Competitor]\" *(requires legal approval per Brand Guidelines)*\r\n\r\n#### Low Intent\r\n\r\n* \"Learn How Virtual Cards Work\"\r\n* \"Browse Success Stories\"\r\n* \"Download the Travel Program Guide\"\r\n* \"Join Our Newsletter\"\r\n\r\n***\r\n\r\n## Customer Reference: TechFlow\r\n\r\n| Fact                | Value                                                      | Approved Usage                              |\r\n| ------------------- | ---------------------------------------------------------- | ------------------------------------------- |\r\n| Contact             | Sarah Mitchell, CFO                                        | Case studies, sales materials, testimonials |\r\n| Company size        | 500 employees                                              | Case studies, sales materials               |\r\n| Result              | Month-end reconciliation reduced from 3 days to 2 hours    | Case studies, sales materials               |\r\n| Financial impact    | $180,000 saved in first year from reduced processing costs | Case studies, sales materials               |\r\n| Implementation time | 4 days                                                     | Case studies, sales materials               |\r\n\r\n**Approved Testimonial:**\r\n\r\n> \"We went from spending 3 days on month-end reconciliation to just 2 hours. The ROI was immediate — we saved $180,000 in our first year just from reduced processing costs. Implementation took 4 days.\"— **Sarah Mitchell**, CFO, TechFlow (500 employees)\r\n\r\n***\r\n\r\n## Pricing Facts\r\n\r\n| Tier               | Price          | Details                |\r\n| ------------------ | -------------- | ---------------------- |\r\n| Starter            | $8/user/month  | Up to 50 users         |\r\n| Growth             | $12/user/month | 50–200 users           |\r\n| Enterprise         | Custom pricing | 200+ users             |\r\n| Implementation fee | Free           | With annual commitment |\r\n\r\n***\r\n\r\n## Compliance & Privacy Boilerplate\r\n\r\n* Always include privacy statements near forms.\r\n* Standard text: \"We respect your privacy. Your information will never be shared with third parties.\"\r\n* For demos: \"We'll only use your information to schedule your demo.\"\r\n\r\n***\r\n\r\n## Checklist\r\n\r\n* [ ] All statistics pulled from the Approved Statistics tables above (none invented)?\r\n* [ ] Mandatory phrasing rules followed exactly?\r\n* [ ] Numbers paired with human impact per copy pattern?\r\n* [ ] Competitor names stripped from external-facing output?\r\n* [ ] Pricing only included where appropriate (pricing pages, sales materials)?\r\n* [ ] Customer reference data attributed to TechFlow?\r\n* [ ] Testimonial quoted verbatim (not paraphrased)?"
