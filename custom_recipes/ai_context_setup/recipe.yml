name: AI Context Setup
type: recipe
description: 'Sets up the latest AI Context module and adds relevant context items.'
config:
  actions:
    ai_context.agent_pools:
      simpleConfigUpdate:
        agents:
          -
            id: canvas_template_builder_agent
            context_items: {  }
            always_include:
              - '1'
              - '2'
              - '3'
          -
            id: canvas_page_builder_agent
            context_items: {  }
            always_include:
              - '2'
          -
            id: canvas_ai_orchestrator
            context_items: {  }
            always_include:
              - '4'
    ai_context.settings:
      simpleConfigUpdate:
        max_tokens: 10000
