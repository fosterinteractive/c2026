name: AI Context Setup
type: recipe
description: 'Sets up the latest AI Context module and adds relevant context items.'
config:
  actions:
    ai_context.agents:
      simpleConfigUpdate:
        agents:
          -
            id: canvas_template_builder_agent
            context_items: {  }
            always_include:
              - '12'
              - '1'
              - '3'
              - '6'
              - '10'
              - '5'
              - '11'
              - '2'
              - '7'
            excluded_subcontext:
              - '4'
              - '8'
            scope_subscriptions: {  }
          -
            id: canvas_page_builder_agent
            context_items: {  }
            always_include:
              - '12'
              - '1'
              - '3'
              - '6'
              - '10'
              - '5'
              - '11'
              - '2'
              - '7'
            excluded_subcontext:
              - '4'
              - '8'
            scope_subscriptions: {  }
          -
            id: canvas_ai_orchestrator
            context_items: {  }
            always_include:
              - '1'
              - '12'
            excluded_subcontext:
              - '3'
              - '6'
              - '10'
              - '11'
              - '4'
              - '7'
              - '8'
            scope_subscriptions: {  }
          -
            id: drupal_canvas_seo_agent
            context_items: {  }
            always_include: {  }
          -
            id: analytics_monitoring_agent
            context_items: {  }
            always_include:
              - '9'
            excluded_subcontext: {  }
            scope_subscriptions: {  }
            
    ai_context.settings:
      simpleConfigUpdate:
        strategy: keyword
        max_context_items: 10
        max_global_items: 3
        max_tokens: 200000
        show_overview_page: true
        context_prefix: 'The following site-specific context applies to this task. Use it strictly when relevant; do not override user intent.'
        target_entity_types:
          - node
          - taxonomy_term
          - canvas_page
          - media
        usage_tracking_enabled: true
        usage_max_records: 10000
        usage_max_age: 31536000
        debug_logging: false
