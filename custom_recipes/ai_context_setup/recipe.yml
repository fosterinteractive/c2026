name: AI Context Setup
type: recipe
description: 'Sets up the latest AI Context module and adds relevant context items.'
config:
  actions:
    ai_context.agents:
      simpleConfigUpdate:
        agents:
          -
            id: canvas_template_builder_agent
            context_items: {  }
            always_include:
              - '1'
              - '3'
              - '4'
            excluded_subcontext: {  }
            scope_subscriptions: {  }
          -
            id: canvas_page_builder_agent
            context_items: {  }
            always_include:
              - '1'
              - '3'
            excluded_subcontext: {  }
            scope_subscriptions: {  }
          -
            id: canvas_ai_orchestrator
            context_items: {  }
            always_include:
              - '1'
              - '5'
            excluded_subcontext: {  }
            scope_subscriptions: {  }
          -
            id: drupal_canvas_seo_agent
            context_items: {  }
            always_include: {  }
          -
            id: analytics_monitoring_agent
            context_items: { }
            always_include:
              - '2'
            excluded_subcontext: { }
            scope_subscriptions: { }
    ai_context.settings:
      simpleConfigUpdate:
        max_tokens: 30000
