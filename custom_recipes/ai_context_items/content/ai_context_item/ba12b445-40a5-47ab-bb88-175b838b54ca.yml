  label:
    -
      value: 'Content Structure: PPC Landing Page'
  description:
    -
      value: 'Use when building or reviewing FinDrop event PPC landing pages'
      format: plain_text
  purpose:
    -
      value: 'Load when building or reviewing FinDrop event landing pages (webinars, virtual events, case study presentations, product workshops). The author supplies event details — this document supplies the structure.'
      format: plain_text
  content:
    -
      value: "# Content Strategy: Events PPC Landing Pages\r\n\r\n**Goal:** Build trust and demonstrate value for prospects evaluating solutions. Encourage event registration.\r\n\r\n**Examples:** Webinars, virtual events, case study presentations, product workshops\r\n\r\n## Core Rules\r\n\r\n* All page content goes in the content region. Do not modify header or footer.\r\n* Use `section` components as the primary wrapper for every content block (hero excluded).\r\n* Event landing pages use `hero-billboard` as the hero component.\r\n* Copy should be clear and action-oriented. Address specific pain points with concrete solutions. Include exact numbers (savings, time, percentages) from Key Facts where applicable. Emphasize speed and ease of implementation.\r\n\r\n## Section Defaults\r\n\r\nApply to every `section` unless an override is noted:\r\n\r\n* Width `100%`, mobile columns `1`.\r\n* Margin top/bottom `96` (tighter than product pages to keep the page compact).\r\n* Padding top/bottom `0`. Set to `64` when a background color is applied.\r\n* No background color unless the section is the bottom CTA (`muted`) or testimonials (`muted`).\r\n\r\n## Background Color Rules\r\n\r\nSame as product pages:\r\n\r\n* **Most sections: no background color.**\r\n* **`muted`: Bottom CTA and Testimonials only.**\r\n* **`accent`, `primary`, `secondary`: do not use.**\r\n\r\n## Image Policy\r\n\r\n* Use photography from the **Cindy Liu photoshoot** for the hero and CTA section backgrounds. Search the media library for \"Cindy Liu Shoot\" or \"FinDrop lifestyle photography.\"\r\n* Use FinDrop illustrations for body section images (e.g., card images in capabilities section). Search by product and feature described.\r\n* Professional headshots for testimonials.\r\n* No image may appear more than once on the same page.\r\n* Do not set `size` (aspect ratio) on `image` components by default.\r\n\r\n***\r\n\r\n## Page Sections — Top to Bottom\r\n\r\n| Order | Section                             | Required |\r\n| ----- | ----------------------------------- | -------- |\r\n| 1     | Hero Billboard                      | Yes      |\r\n| 2     | Product Capabilities (3 Cards)      | Yes      |\r\n| 3     | Audience / Attendees (4 Icon Cards) | No       |\r\n| 4     | Testimonial                         | No       |\r\n| 5     | Bottom CTA                          | Yes      |\r\n| 6     | Legal Disclaimer                    | No       |\r\n\r\n***\r\n\r\n### 1. Hero Billboard — ALWAYS INCLUDE\r\n\r\n`hero-billboard` — always for event landing pages.\r\n\r\n**Hero props:**\r\n\r\n| Prop             | Value                                                                                                  |\r\n| ---------------- | ------------------------------------------------------------------------------------------------------ |\r\n| height           | full                                                                                                   |\r\n| flex\\_position   | bottom-left                                                                                            |\r\n| overlay\\_opacity | 40%                                                                                                    |\r\n| object\\_position | center                                                                                                 |\r\n| overlap\\_navbar  | true                                                                                                   |\r\n| media            | Cindy Liu photoshoot — search media library for lifestyle photography of someone using the FinDrop app |\r\n\r\n**`hero_slot`** → `sdc.byte_theme.group` containing:\r\n\r\nGroup override: `flex_gap`: `lg` (large spacing).\r\n\r\n| Child      | Component | Props                                                                                                                          |\r\n| ---------- | --------- | ------------------------------------------------------------------------------------------------------------------------------ |\r\n| Eyebrow    | text      | Event type label (UPPERCASE, e.g., \"LIVE WEBINAR\"), text\\_size: text-sm, text\\_color: default                                  |\r\n| H1         | heading   | level: 1, text\\_size: heading-responsive-7xl, text\\_color: default, align: left. 8 words or less. Express ending a pain point. |\r\n| Subhead    | text      | Short event description, 150 characters or less, text\\_size: text-lg, text\\_color: default. Sentence case.                     |\r\n| CTA        | button    | variant: primary, size: large, icon: user-plus. Title Case action verb: \"Reserve Your Spot\" or \"Register Now\".                 |\r\n| Event info | text      | Date and time of event only. text\\_size: normal, text\\_color: default. Wrap in \\<p>\\<em> tags for italic styling.              |\r\n\r\n***\r\n\r\n### 2. Product Capabilities (3 Cards) — ALWAYS INCLUDE\r\n\r\n`section` → 3 `card` components in grid slot.\r\n\r\n**Section props:**\r\n\r\n| Prop                  | Value    |\r\n| --------------------- | -------- |\r\n| width                 | 100%     |\r\n| columns               | 33-33-33 |\r\n| mobile\\_columns       | 1        |\r\n| margin\\_block\\_start  | 96       |\r\n| margin\\_block\\_end    | 96       |\r\n| padding\\_block\\_start | 0        |\r\n| padding\\_block\\_end   | 0        |\r\n| section\\_header       | false    |\r\n| section\\_footer       | false    |\r\n\r\n**Each `card` component:**\r\n\r\n| Prop          | Value                                                                                                         |\r\n| ------------- | ------------------------------------------------------------------------------------------------------------- |\r\n| style         | framed                                                                                                        |\r\n| orientation   | vertical                                                                                                      |\r\n| background    | default                                                                                                       |\r\n| heading\\_text | Short benefit-focused title, \\~30 characters, Title Case. Reference Key Facts > Product Capabilities.         |\r\n| level         | 3                                                                                                             |\r\n| url           | #                                                                                                             |\r\n| media         | Search media library for FinDrop illustrations related to the product benefit. No image repeated on the page. |\r\n| text          | Brief, outcome-focused description under 100 characters. Sentence case. No trailing punctuation.              |\r\n\r\n***\r\n\r\n### 3. Audience / Attendees (4 Icon Cards) — OPTIONAL\r\n\r\n**Include when** the event targets specific roles and calling them out helps conversion.\r\n\r\n`section` → heading in header slot → 4 `card-icon` components in grid slot.\r\n\r\n**Section props:**\r\n\r\n| Prop                  | Value |\r\n| --------------------- | ----- |\r\n| width                 | 75%   |\r\n| columns               | 50-50 |\r\n| mobile\\_columns       | 1     |\r\n| margin\\_block\\_start  | 96    |\r\n| margin\\_block\\_end    | 96    |\r\n| padding\\_block\\_start | 0     |\r\n| padding\\_block\\_end   | 0     |\r\n| section\\_header       | true  |\r\n| section\\_footer       | false |\r\n\r\n**`header_slot`** → `sdc.byte_theme.heading`\r\n\r\n| Prop          | Value                               |\r\n| ------------- | ----------------------------------- |\r\n| heading\\_text | Short title about who should attend |\r\n| level         | 2                                   |\r\n| text\\_size    | heading-responsive-5xl              |\r\n| text\\_color   | default                             |\r\n| align         | center                              |\r\n\r\n**`main_slot`** → 4× `sdc.byte_theme.card-icon`\r\n\r\nEach card:\r\n\r\n| Prop              | Value                                                                 |\r\n| ----------------- | --------------------------------------------------------------------- |\r\n| background\\_color | muted                                                                 |\r\n| border\\_radius    | large                                                                 |\r\n| icon\\_size        | extra-large                                                           |\r\n| icon\\_align       | center                                                                |\r\n| text\\_align       | center                                                                |\r\n| text              | Short audience description, Title Case                                |\r\n| icon              | Appropriate Phosphor icon for the role. No icon repeated on the page. |\r\n\r\nDo not set `tile_size`. Do not use the `alien` icon.\r\n\r\n***\r\n\r\n### 4. Testimonial — OPTIONAL\r\n\r\n**Include when** an approved customer quote is available and relevant to the event topic.\r\n\r\n`section` → `card-testimonial` in grid slot.\r\n\r\n**Section props:**\r\n\r\n| Prop                  | Value |\r\n| --------------------- | ----- |\r\n| width                 | 50%   |\r\n| columns               | 100   |\r\n| mobile\\_columns       | 1     |\r\n| margin\\_block\\_start  | 96    |\r\n| margin\\_block\\_end    | 96    |\r\n| padding\\_block\\_start | 64    |\r\n| padding\\_block\\_end   | 64    |\r\n| background\\_color     | muted |\r\n| section\\_header       | false |\r\n| section\\_footer       | false |\r\n\r\nWidth `100%` if 2 testimonials (use `50-50` grid). Only use approved testimonials from Key Facts. Never fabricate.\r\n\r\nCard style: `default`. Center-aligned. Include headshot from media library when available.\r\n\r\n***\r\n\r\n### 5. Bottom CTA — ALWAYS INCLUDE\r\n\r\n`section` → text content `group` (left) + `image` directly in grid slot (right, no group wrapper).\r\n\r\n**Section props:**\r\n\r\n| Prop                  | Value |\r\n| --------------------- | ----- |\r\n| width                 | 75%   |\r\n| columns               | 50-50 |\r\n| mobile\\_columns       | 1     |\r\n| margin\\_block\\_start  | 96    |\r\n| margin\\_block\\_end    | 48    |\r\n| padding\\_block\\_start | 64    |\r\n| padding\\_block\\_end   | 64    |\r\n| background\\_color     | muted |\r\n| section\\_header       | false |\r\n| section\\_footer       | false |\r\n\r\n**`main_slot`** → `sdc.byte_theme.group` (text content, left) + `sdc.byte_theme.image` (right, direct in grid slot)\r\n\r\n**Text group:**\r\n\r\n| Prop            | Value  |\r\n| --------------- | ------ |\r\n| flex\\_direction | column |\r\n| flex\\_gap       | lg     |\r\n| items\\_align    | start  |\r\n| flex\\_align     | center |\r\n| radius          | sm     |\r\n| padding         | sm     |\r\n\r\nContains:\r\n\r\n| Child   | Component | Props                                                                                                                                                                                                           |\r\n| ------- | --------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\r\n| Eyebrow | text      | Event date and time (UPPERCASE), text\\_size: text-sm, text\\_color: default                                                                                                                                      |\r\n| H2      | heading   | level: 2, text\\_size: heading-responsive-4xl, text\\_color: default, align: left. 8 words or less. Action-focused title that clearly states the event (e.g., \"Reserve Your Spot: Live Expense Automation Demo\"). |\r\n| Body    | text      | Benefits of attending or who will be there. 150 characters or less. text\\_size: text-lg, text\\_color: default. Sentence case.                                                                                   |\r\n| CTA     | button    | variant: primary, size: large, icon: user-plus. Same label as hero CTA.                                                                                                                                         |\r\n| Details | text      | Attendance limits, recording availability, or other logistics. text\\_size: normal, text\\_color: default.                                                                                                        |\r\n\r\n**Right column:** `sdc.byte_theme.image` placed directly in grid slot (no group wrapper). Do not set `size`. Search media library for a FinDrop illustration related to the product benefits.\r\n\r\n***\r\n\r\n### 6. Legal Disclaimer — OPTIONAL\r\n\r\n**Include when** banking or fintech regulatory disclosures apply.\r\n\r\nStandalone `text` in content region after all sections. `text_size`: `text-xs`, center-aligned.\r\n\r\n***\r\n\r\n## Content Mapping Logic\r\n\r\n| Event content pattern                                          | Maps to                        |\r\n| -------------------------------------------------------------- | ------------------------------ |\r\n| Event type, headline, description, date/time, registration CTA | Hero billboard (1)             |\r\n| 3 product benefit highlights                                   | Product capabilities cards (2) |\r\n| Target audience roles                                          | Audience icon cards (3)        |\r\n| Customer quote with attribution                                | Testimonial (4)                |\r\n| Registration CTA, event details, logistics                     | Bottom CTA (5)                 |\r\n| Regulatory/legal fine print                                    | Legal disclaimer (6)           |\r\n\r\n***\r\n\r\n## Constraints\r\n\r\n* Never use `hero-side-by-side` or `hero-blog` for event pages. Always `hero-billboard`.\r\n* Never apply background color to sections other than Testimonials (`muted`) and Bottom CTA (`muted`).\r\n* Never use `accent`, `primary`, or `secondary` as section background colors.\r\n* Never set `tile_size` on icon cards. Leave unset.\r\n* Never set `size` on image components. Leave unset.\r\n* Never wrap images in a group (CSS bug).\r\n* Never fabricate testimonials.\r\n* All stats from Key Facts. Follow mandatory phrasing rules.\r\n* No competitor names in external content.\r\n* No image repeated on the page.\r\n* Only one H1 per page (in the hero). All other headings are H2 or lower.\r\n\r\n***\r\n\r\n## Checklist\r\n\r\n* Hero uses `hero-billboard` with `overlap_navbar: true`?\r\n* Hero eyebrow uses `text-sm` uppercase, `text_color: default`?\r\n* Hero group uses `flex_gap: lg`?\r\n* Only one H1 (in hero)?\r\n* Product capabilities use 3 `card` components with `style: framed`?\r\n* Icon cards have no `tile_size` set?\r\n* Background color only on Testimonials and Bottom CTA (`muted`)?\r\n* Text color correct for background (`default` on dark)?\r\n* Images not wrapped in groups?\r\n* No image repeated on page?\r\n* Stats from Key Facts only?\r\n* No competitor names?\r\n* Registration button uses `icon: user-plus`?\r\n* Bottom CTA heading is H2 (not H1)?"
      format: plain_text
