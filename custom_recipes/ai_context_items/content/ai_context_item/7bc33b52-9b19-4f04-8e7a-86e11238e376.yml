  purpose:
    -
      value: "Load when selecting, placing, or generating images and icons for FinDrop pages. Covers the three visual approaches (custom illustrations, product screenshots, and branded photography), image repetition rules, Phosphor icon library usage, and alt text standards. Skip for text-only writing tasks.\r\n"
      format: plain_text
  content:
    -
      value: "# Visuals & Imagery\r\n\r\n## Three Visual Approaches\r\n\r\nFinDrop uses three distinct visual styles across the site. Each has a clear purpose — do not mix them within the same content block.\r\n\r\n### 1. Custom Illustrations\r\n\r\nCustom illustrations represent how the FinDrop product appears and is displayed. These are stylized, branded depictions of the platform's interface, workflows, and features — not literal screenshots.\r\n\r\n**When to use:**\r\n\r\n* Hero sections on product pages and landing pages\r\n* Feature explanation sections (showing a workflow or process)\r\n* Value proposition cards where a visual reinforces the benefit\r\n* Marketing collateral (ads, social, email headers)\r\n\r\n**Rules:**\r\n\r\n* Illustrations should depict recognizable FinDrop UI patterns (dashboards, card creation flows, approval screens) in a clean, stylized form.\r\n* Keep illustrations consistent in style — same line weight, color palette, and level of detail across a page.\r\n* **Never repeat the same illustration on a single page.** Each illustration must be unique to the section it supports. If two sections describe similar features, use different angles, compositions, or workflow states to differentiate them.\r\n* Illustrations should feel modern and clean — not cluttered, not cartoonish.\r\n\r\n### 2. Product Screenshots & Screen Captures\r\n\r\nActual screenshots of the FinDrop platform, used when authenticity and specificity matter more than style.\r\n\r\n**When to use:**\r\n\r\n* Demo walkthroughs and tutorials\r\n* Case study pages showing real results\r\n* Help documentation and support articles\r\n* Feature detail pages where exact UI is important\r\n\r\n**Rules:**\r\n\r\n* Screenshots must show current UI (no outdated versions).\r\n* Blur or redact any real customer data visible in screenshots.\r\n* Use consistent browser chrome or device frames for presentation.\r\n\r\n### 3. Branded Photography\r\n\r\nProfessional photo shoots of real people using the FinDrop product in real-world work settings. These images show the human side of FinDrop — finance teams, office managers, traveling employees, and executives interacting with the platform on laptops, phones, and tablets in authentic environments.\r\n\r\n**When to use:**\r\n\r\n* Hero sections where a human connection matters (e.g., homepage, about page)\r\n* Testimonial and case study sections\r\n* Team and culture pages\r\n* Landing pages where trust and relatability are the priority\r\n* Blog post headers and social media\r\n\r\n**Rules:**\r\n\r\n* Only use images from official FinDrop photo shoots. These are tagged and identified in the media library as part of the shoot — do not substitute with stock photography.\r\n* Photos should show natural, unposed interactions with the product — not staged \"pointing at screen\" compositions.\r\n* Ensure diversity in the people represented across a page and across the site.\r\n* **Never repeat the same photo on a single page.** Follow the same uniqueness rule as illustrations and screenshots.\r\n* When pairing with text, the photo should reinforce the scenario described (e.g., a testimonial from a Controller paired with a photo of someone reviewing a dashboard, not a generic office shot).\r\n\r\n***\r\n\r\n## Image Repetition Rules\r\n\r\n**No image may appear more than once on the same page.** This applies to:\r\n\r\n* Custom illustrations\r\n* Product screenshots\r\n* Branded photography\r\n* Icons used as decorative hero elements (standard inline icons are exempt)\r\n\r\nIf a page has multiple sections that address similar themes (e.g., two sections about card features), each section must use a visually distinct image. Reusing the same asset makes a page feel template-generated and undermines credibility.\r\n\r\n***\r\n\r\n## Icons: Phosphor Icon Library\r\n\r\nAll icons across the FinDrop site use the **Phosphor Icons** library ([https://phosphoricons.com](https://phosphoricons.com)). Do not use other icon sets, custom SVGs for standard UI icons, or emoji as icon substitutes.\r\n\r\n### Usage Rules\r\n\r\n* Use the **Regular** weight as the default across the site.\r\n* Use **Bold** weight for emphasis in hero sections or primary CTAs only.\r\n* Use **Fill** weight sparingly — for active/selected states in navigation or toggles.\r\n* Never mix weights within the same component or icon group.\r\n* Icons should be sized consistently within a component grid (e.g., all `card-icon` components on a page use the same icon size).\r\n\r\n### Recommended Icons by Use Case\r\n\r\nThe following Phosphor icons are approved for common FinDrop contexts. Use these as a starting point — other Phosphor icons are allowed, but prefer these for consistency across pages.\r\n\r\n#### Finance & Money\r\n\r\n| Icon Name              | Use For                                           |\r\n| ---------------------- | ------------------------------------------------- |\r\n| credit-card            | Card issuance, payment methods, card management   |\r\n| wallet                 | Account balance, payment overview                 |\r\n| money                  | Cost savings, financial impact, pricing           |\r\n| coins                  | Transaction volume, multiple payments             |\r\n| coin                   | Single transaction, per-unit cost                 |\r\n| piggy-bank             | Savings, ROI, cost reduction                      |\r\n| currency-circle-dollar | Dollar amounts, currency, revenue                 |\r\n| receipt                | Expense tracking, receipt capture, reconciliation |\r\n| invoice                | Billing, accounts payable, invoicing              |\r\n| bank                   | Banking integrations, financial institutions      |\r\n| hand-coins             | Reimbursements, payouts                           |\r\n| contactless-payment    | Modern payment methods, tap-to-pay                |\r\n| scales                 | Balance, comparison, fairness                     |\r\n| tip-jar                | Rewards, bonuses                                  |\r\n| vault                  | Secure storage, financial security                |\r\n\r\n#### Analytics & Performance\r\n\r\n| Icon Name          | Use For                                           |\r\n| ------------------ | ------------------------------------------------- |\r\n| chart-line-up      | Growth, performance improvement, trends           |\r\n| chart-bar          | Reporting, data comparison                        |\r\n| chart-pie          | Budget breakdown, allocation                      |\r\n| chart-donut        | Spending categories, distribution                 |\r\n| trend-up           | Positive metrics, improvement                     |\r\n| trend-down         | Cost reduction, spend decrease (positive framing) |\r\n| presentation-chart | Reports, presentations, board decks               |\r\n| funnel             | Conversion funnel, filtering                      |\r\n| target             | Goals, KPIs, benchmarks                           |\r\n| graph              | Data relationships, complex analytics             |\r\n\r\n#### Security & Trust\r\n\r\n| Icon Name    | Use For                                          |\r\n| ------------ | ------------------------------------------------ |\r\n| shield-check | Security verified, compliance, trust             |\r\n| lock         | Encryption, data protection, access control      |\r\n| key          | Authentication, access, API keys                 |\r\n| fingerprint  | Identity verification, biometrics                |\r\n| eye          | Visibility, monitoring, live tracking            |\r\n| seal-check   | Certification, verification badges (e.g., SOC 2) |\r\n| warning      | Alerts, policy violations, flags                 |\r\n\r\n#### Speed & Automation\r\n\r\n| Icon Name        | Use For                                   |\r\n| ---------------- | ----------------------------------------- |\r\n| lightning        | Speed, instant actions, fast processing   |\r\n| clock            | Time savings, scheduling, processing time |\r\n| timer            | Countdown, speed benchmarks               |\r\n| clock-countdown  | Deadline, urgency, time-to-value          |\r\n| gear             | Automation, settings, configuration       |\r\n| arrows-clockwise | Sync, refresh, automated cycles           |\r\n\r\n#### People & Teams\r\n\r\n| Icon Name       | Use For                           |\r\n| --------------- | --------------------------------- |\r\n| users           | Teams, collaboration, multi-user  |\r\n| user            | Individual user, profile, persona |\r\n| user-check      | Approved user, verified identity  |\r\n| user-gear       | Admin, settings, role management  |\r\n| building-office | Company, enterprise, organization |\r\n| buildings       | Multi-company, partners           |\r\n| handshake       | Partnerships, agreements          |\r\n\r\n#### Documents & Workflow\r\n\r\n| Icon Name      | Use For                               |\r\n| -------------- | ------------------------------------- |\r\n| file-text      | Documents, reports, policies          |\r\n| clipboard-text | Checklists, audits, compliance checks |\r\n| check-circle   | Approval, completion, success         |\r\n| funnel-simple  | Filtering, sorting, narrowing results |\r\n| flow-arrow     | Workflow, process, pipeline           |\r\n| tree-structure | Hierarchy, org structure, categories  |\r\n\r\n***\r\n\r\n## Alt Text Standards\r\n\r\n* Every image must have descriptive alt text.\r\n* Alt text should describe the content and function of the image, not the design style.\r\n* For decorative images, use an empty alt attribute.\r\n* For charts and data visualizations, alt text must summarize the key data point (e.g., \"Bar chart showing 80% reduction in expense processing time\").\r\n* For product illustrations, describe what the illustration depicts functionally (e.g., \"Illustration of the FinDrop card creation dashboard showing spending limit controls\").\r\n\r\n***\r\n\r\n## Gaps to Fill\r\n\r\nThe following areas need documented guidance before this sub-context is fully complete:\r\n\r\n* Color palette (primary, secondary, accent, semantic colors)\r\n* Typography scale and font families\r\n* Photography art direction (mood, lighting, composition rules)\r\n* Illustration style guide (line weight, color usage, level of detail)\r\n* Image sizing and aspect ratio requirements by component type\r\n* Video/motion guidelines"
      format: plain_text
