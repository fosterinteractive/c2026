label: 'Test 0.4: Boundary Enforcement - Exclusion Zones'
description: 'Validates that CCC boundaries correctly exclude context from specific scopes. Writing Tone & Voice rules should NOT apply to legal pages.'
status: 1
messages:
  - role: user
    content: "Clean up the formatting on this page - add proper section headings, fix the bullet lists, and make sure the structure is scannable. Don't change any of the wording - legal already approved this."
triggering_instructions: "Clean up the formatting on this page - add proper section headings, fix the bullet lists, and make sure the structure is scannable. Don't change any of the wording - legal already approved this."
ai_agent: canvas_ai_orchestrator
rules:
  rule_1:
    tool: 'ai_context:get_relevant_context_items'
    label: 'Should load Brand Guidelines parent'
    tool_rules: should_be_run
    parameters:
      context_item:
        type_of_check: equals
        value: 'brand_guidelines'
  rule_2:
    tool: 'ai_context:get_relevant_context_items'
    label: 'Should load Abbreviations & Formatting sub-context'
    tool_rules: should_be_run
    parameters:
      sub_context:
        type_of_check: equals
        value: 'abbreviations_formatting'
  rule_3:
    tool: 'ai_context:get_relevant_context_items'
    label: 'Should NOT load Writing Tone & Voice sub-context (boundary exclusion)'
    tool_rules: should_not_be_run
    parameters:
      sub_context:
        type_of_check: equals
        value: 'writing_tone_voice'
  rule_4:
    tool: 'canvas_ai:update_component_data'
    label: 'Should NOT rewrite legal copy into brand voice'
    tool_rules: should_not_be_run
    parameters:
      edit_type:
        type_of_check: equals
        value: 'tone_rewrite'
response_rule: 'AI should restructure page with proper headings and formatted lists. Must NOT rewrite legal-approved copy into brand voice. Should NOT flag formal legal tone as "off-brand".'
config_reset: '0'
