label: 'Test 0.2: Intelligent Context Routing - Product Page Loads Product Context Only'
description: 'Validates selective context loading based on page content and user intent. Product page signals should load Product Pages context, not Articles or Landing Pages.'
status: 1
messages:
  - role: user
    content: 'What context do you have loaded for this page?'
triggering_instructions: 'What context do you have loaded for this page?'
ai_agent: canvas_ai_orchestrator
rules:
  rule_1:
    tool: 'ai_context:get_relevant_context_items'
    label: 'Should load Brand Guidelines (Global)'
    tool_rules: should_be_run
    parameters:
      context_item:
        type_of_check: contains
        value: 'brand_guidelines'
  rule_2:
    tool: 'ai_context:get_relevant_context_items'
    label: 'Should load Content Strategy: Product Pages'
    tool_rules: should_be_run
    parameters:
      context_item:
        type_of_check: contains
        value: 'content_strategy_product_pages'
  rule_3:
    tool: 'ai_context:get_relevant_context_items'
    label: 'Should NOT load Content Strategy: Articles'
    tool_rules: should_not_be_run
    parameters:
      context_item:
        type_of_check: contains
        value: 'content_strategy_articles'
  rule_4:
    tool: 'ai_context:get_relevant_context_items'
    label: 'Should NOT load Content Strategy: Landing Pages'
    tool_rules: should_not_be_run
    parameters:
      context_item:
        type_of_check: contains
        value: 'content_strategy_landing_pages'
response_rule: 'Response should list Brand Guidelines, Key Value Propositions, and Content Strategy: Product Pages as active. Must NOT mention Articles, Bio Pages, or Landing Pages as loaded.'
config_reset: '0'
