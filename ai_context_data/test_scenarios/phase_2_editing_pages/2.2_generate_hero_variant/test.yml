label: 'Test 2.2: Generate a New Hero Variant'
description: 'Validates that AI generates a new variant of an existing section for comparison rather than destructively editing.'
status: 1
messages:
  - role: user
    content: "Generate a new hero variant - high impact, bolder, main value prop front and center."
triggering_instructions: "Generate a new hero variant - high impact, bolder, main value prop front and center."
ai_agent: canvas_ai_orchestrator
rules:
  rule_1:
    tool: 'canvas_ai:set_component_structure'
    label: 'Should generate NEW hero component'
    tool_rules: should_be_run
    parameters:
      component_type:
        type_of_check: equals
        value: 'sdc.mercury.hero-billboard'
      action:
        type_of_check: equals
        value: 'create_new'
  rule_2:
    # NOTE: Canvas AI cannot delete components — set_component_structure is the closest equivalent,
    # but this rule validates the original hero must NOT be removed.
    tool: 'canvas_ai:set_component_structure'
    label: 'Should NOT delete original hero'
    tool_rules: should_not_be_run
response_rule: 'AI should generate a new Billboard Hero variant below/adjacent to existing. Original hero must remain for comparison. New variant should have punchier headline with adoption stat prominent.'
config_reset: '0'
