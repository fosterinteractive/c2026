label: 'Test 6.3: AI Generates Updated Hero with Keyword Alignment'
description: 'Validates that AI generates new content drawn from CCC knowledge to fix diagnosed issues, including natural keyword integration.'
status: 1
messages:
  - role: user
    content: "Yes, fix all three. Lead with the security differentiator. Make sure 'enterprise security' is in the subhead - that's what people are searching for. Outcomes first, not features."
triggering_instructions: "Yes, fix all three. Lead with the security differentiator. Make sure 'enterprise security' is in the subhead."
ai_agent: canvas_ai_assistant
rules:
  rule_1:
    tool: 'ai_agents::canvas::generate_component'
    label: 'Should generate new hero with security focus'
    tool_rules: should_be_run
    parameters:
      keyword:
        type_of_check: contains
        value: 'enterprise security'
  rule_2:
    tool: 'ai_agents::ccc::extract_content'
    label: 'Should extract differentiator from Sales Pitch Deck'
    tool_rules: should_be_run
    parameters:
      source:
        type_of_check: equals
        value: 'sales_pitch_deck_v7'
response_rule: 'AI should generate new hero with security-focused headline, enterprise security in subhead (naturally, not stuffed), differentiator from sales deck woven in. Existing CTAs preserved.'
config_reset: '0'
