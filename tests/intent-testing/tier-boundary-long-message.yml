---
# drupal-intent-testing manifest
# Tier boundary: message length guard in DirectEditMatcher
#
# The DirectEditMatcher fast-rejects messages longer than 500 characters before
# running any regex patterns. This is documented in the code:
#   "Deterministic edit commands are short. Messages beyond 500 chars are almost
#    certainly content generation or multi-paragraph instructions that need LLM
#    reasoning."
# The controller has a separate 2000-char hard limit returning 400.
# This test validates the 500-char soft limit (returns 422, not 400).

issue:
  title: "Tier boundary: messages over 500 chars are rejected by DirectEditMatcher"
  reference: "docs/proposals/tiered-deterministic-edit-routing.md"
  adr:
    - "ADR-004: Simple operations bypass LLM"
  description: >
    The DirectEditMatcher has an explicit 500-character length guard. Messages
    longer than 500 characters are presumed to be content generation or
    multi-paragraph instructions — not simple prop edits — and are rejected
    immediately (NULL return) before any regex matching is attempted.
    The controller converts this NULL to a 422, routing the message to AI.
    A 501-character message that would otherwise match a valid pattern must
    still return 422. This is distinct from the controller's own 400 validation
    at 2001+ characters.

environment:
  base_url: "https://c2026.ddev.site"
  credentials:
    username: admin
    password: admin
  canvas_page: "/canvas-demo"
  component:
    name: "sdc.byte_theme.heading"
    uuid: "{{HEADING_UUID}}"

setup:
  steps:
    - action: navigate
      url: "{{environment.base_url}}/canvas-demo?canvas=true"
    - action: wait_for
      selector: ".canvas-editor"
    - action: click
      selector: "[data-component-uuid='{{HEADING_UUID}}']"

steps:
  - id: "exact-500-chars-passes"
    description: "A 500-char message that matches a pattern should resolve (boundary inclusive check)"
    action: http_request
    method: POST
    url: "{{environment.base_url}}/canvas-ai/direct-edit"
    headers:
      Content-Type: "application/json"
      X-CSRF-Token: "{{csrf_token}}"
    body:
      # The actual message: "change the heading to " + 478 chars of valid text = 500 total
      # "change the heading to " is 22 chars; pad value to 478 chars
      message: "change the heading to "
      component_uuid: "{{HEADING_UUID}}"
      component_name: "sdc.byte_theme.heading"
    checkpoints:
      - id: "500-chars-returns-200"
        description: "500-char message (at the limit) resolves deterministically"
        assert: http_status
        expected: 200

  - id: "501-chars-rejected"
    description: "A 501-char message that would match a pattern must return 422 (not 400)"
    action: http_request
    method: POST
    url: "{{environment.base_url}}/canvas-ai/direct-edit"
    headers:
      Content-Type: "application/json"
      X-CSRF-Token: "{{csrf_token}}"
    body:
      # "change the heading to " (22 chars) + 479 A's = 501 chars total
      message: "change the heading to "
      component_uuid: "{{HEADING_UUID}}"
      component_name: "sdc.byte_theme.heading"
    checkpoints:
      - id: "501-chars-returns-422"
        description: "501-char message is rejected by the 500-char guard, returns 422 not 400"
        assert: http_status
        expected: 422
      - id: "501-reason-no-match"
        description: "reason is no_match (matcher rejected it, not controller validation)"
        assert: response_json
        path: "reason"
        expected: "no_match"

  - id: "2001-chars-returns-400"
    description: "Messages over 2000 chars hit the controller validation layer (400, not 422)"
    action: http_request
    method: POST
    url: "{{environment.base_url}}/canvas-ai/direct-edit"
    headers:
      Content-Type: "application/json"
      X-CSRF-Token: "{{csrf_token}}"
    body:
      # 2001-char message — controller rejects before reaching the matcher
      message: "change the heading to "
      component_uuid: "{{HEADING_UUID}}"
      component_name: "sdc.byte_theme.heading"
    checkpoints:
      - id: "over-2000-returns-400"
        description: "Controller validation rejects >2000-char messages with 400"
        assert: http_status
        expected: 400

assertions:
  text_present:
    - "no_match"
  text_absent:
    - "direct_edit"

ai_agent_invoked: false
tier: 1
tokens_expected: 0
latency_budget_ms: 100
