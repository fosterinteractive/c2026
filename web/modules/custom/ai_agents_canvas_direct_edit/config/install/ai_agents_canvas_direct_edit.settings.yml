telemetry:
  enabled: false
  store_messages: false
  retention_days: 90
  export_enabled: false
model_routing:
  enabled: false
  models:
    simple: ''
    complex: ''
edit_verbs:
  - change
  - set
  - update
  - modify
  - make
  - turn
  - switch
  - put
enum_value_aliases:
  center: ['centered', 'middle']
  left: ['start']
  right: ['end']
  large: ['big']
  small: ['tiny']
  medium: ['mid']
  extra-large: ['xl', 'extra large']
  extra-small: ['xs', 'extra small']
  vertical: ['portrait']
  horizontal: ['landscape', 'side by side']
