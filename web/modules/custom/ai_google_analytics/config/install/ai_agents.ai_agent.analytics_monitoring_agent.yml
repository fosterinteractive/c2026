langcode: en
status: true
dependencies:
  module:
    - ai_context
id: analytics_monitoring_agent
label: 'Analytics Monitoring Agent'
description: ‘This agent generates human-readable summaries and recommendations for Canvas pages that have failed analytics benchmarks. It does not make the pass/fail decision — that is handled by deterministic threshold comparison in PHP.’
system_prompt: |-
  You are a marketing expert helping website administrators understand and improve underperforming content.

  You will receive a list of analytics benchmarks that a page has already been identified as failing. Your job is to:
  1. Summarize the performance issues in plain language suitable for a content editor.
  2. Provide actionable recommendations to improve the failing metrics.

  Do NOT re-evaluate whether the page passes or fails — that decision has already been made. Focus on explaining why the numbers matter and what content or UX changes could help.
secured_system_prompt: '[ai_agent:agent_instructions]'
tools:
  'ai_context:get_relevant_context_items': true
tool_settings:
  'ai_context:get_relevant_context_items':
    return_directly: 0
    require_usage: 0
    description_override: ''
    progress_message: ''
    use_artifacts: 0
orchestration_agent: false
triage_agent: false
max_loops: 3
default_information_tools: ''
tool_usage_limits:
  'ai_context:get_relevant_context_items':
    task:
      action: ''
      hide_property: 0
      not_break: 0
      values: ''
    agent_id:
      action: ''
      hide_property: 0
      not_break: 0
      values: ''
    max_context_items:
      action: ''
      hide_property: 0
      not_break: 0
      values: ''
    always_include:
      action: ''
      hide_property: 0
      not_break: 0
      values: ''
    entity_type:
      action: ''
      hide_property: 0
      not_break: 0
      values: ''
    entity_id:
      action: ''
      hide_property: 0
      not_break: 0
      values: ''
exclude_users_role: false
masquerade_roles: {  }
structured_output_enabled: true
structured_output_schema: "{\n  \"name\": \"analytics_summary\",\n  \"description\": \"A summary of benchmark failures and recommendations for a single page.\",\n  \"schema\": {\n    \"type\": \"object\",\n    \"properties\": {\n      \"summary\": {\n        \"type\": \"string\",\n        \"description\": \"Plain-language summary of which benchmarks failed and why it matters.\"\n      },\n      \"recommendations\": {\n        \"type\": \"string\",\n        \"description\": \"Actionable recommendations to improve the failing metrics.\"\n      }\n    },\n    \"required\": [\"summary\", \"recommendations\"]\n  }\n}\n"
