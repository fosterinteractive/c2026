canvas_ai_scoping.settings:
  type: config_object
  label: 'Canvas AI Scoping settings'
  mapping:
    telemetry_enabled:
      type: boolean
      label: 'Enable detailed direct-edit telemetry logging'
    edit_verbs:
      type: sequence
      label: 'Edit verb patterns recognized by the direct-edit matcher'
      sequence:
        type: string
        label: 'Verb'
    enum_value_aliases:
      type: mapping
      label: 'Enum value aliases for the direct-edit matcher'
      mapping:
        '*':
          type: sequence
          label: 'Aliases for this enum value'
          sequence:
            type: string
            label: 'Alias'
